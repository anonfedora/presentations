        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            transition: background 0.2s ease, color 0.2s ease;
        }

        header {
            padding: 60px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(40px, 6vw, 72px);
            font-weight: var(--display-weight);
            margin-bottom: 12px;
            letter-spacing: var(--display-tracking);
            text-transform: var(--display-case);
        }

        .subtitle {
            font-size: 18px;
            color: var(--grey-4);
        }

        .theme-picker {
            position: relative;
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .theme-toggle-btn .active-theme-icon {
            width: 18px;
            height: 18px;
        }

        .theme-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 190px;
            max-height: min(70vh, 480px);
            overflow-y: auto;
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 20;
        }

        .theme-menu.open {
            display: flex;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .theme-option:hover {
            background: var(--grey-1);
        }

        .theme-option.active {
            font-weight: 700;
        }

        .theme-option .option-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .theme-option-name {
            flex: 1;
        }

        .theme-option .check {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0;
        }

        .theme-option.active .check {
            opacity: 1;
        }

        .presentations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 20px 40px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .presentation-card {
            background: var(--grey-1);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .presentation-card:hover {
            transform: translateY(-4px);
            border-color: var(--line-hover);
            background: var(--grey-2);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-description {
            color: var(--grey-4);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .tag {
            font-size: 11px;
            letter-spacing: 0.05em;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--grey-4);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .slide-count {
            font-size: 13px;
            color: var(--grey-4);
        }

        .view-btn {
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .view-btn:hover {
            background: var(--white);
            color: var(--black);
        }
    </style>
</head>

            <div class="theme-menu" id="themeMenu" role="menu"></div>
        </div>
    </header>

            meridian: '<circle cx="12" cy="12" r="9" /><path d="M12 3a15 15 0 010 18M3 12h18" />',
            masthead: '<rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 9h18M7 13h4M7 16h4" />',
            'dog-ear': '<path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" /><path d="M15 3v5h5" />',
            duet: '<circle cx="9" cy="12" r="6" /><circle cx="15" cy="12" r="6" />'
        };

        const THEMES = [
            { key: 'dark', name: 'Dark' },
            { key: 'light', name: 'White' },
            { key: 'midnight-navy', name: 'Midnight Navy' },
            { key: 'espresso', name: 'Espresso' },
            { key: 'pine', name: 'Pine' },
            { key: 'parchment', name: 'Parchment' },
            { key: 'slate-mist', name: 'Slate Mist' },
            { key: 'editorial', name: 'Editorial' },
            { key: 'swiss-grid', name: 'Swiss Grid' },
            { key: 'terminal', name: 'Terminal' },
            { key: 'bodoni-luxe', name: 'Bodoni Luxe' },
            { key: 'studio-sans', name: 'Studio Sans' },
            { key: 'academic-press', name: 'Academic Press' },
            { key: 'poster-condensed', name: 'Poster Condensed' },
            { key: 'rounded-studio', name: 'Rounded Studio' },
            { key: 'blueprint', name: 'Blueprint' },
            { key: 'slab-authority', name: 'Slab Authority' },
            { key: 'ledger', name: 'Ledger' },
            { key: 'meridian', name: 'Meridian' },
            { key: 'masthead', name: 'Masthead' },
            { key: 'dog-ear', name: 'Dog-ear' },
            { key: 'duet', name: 'Duet' }
        ];

        function themeIconSvg(key, cls) {
            return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${THEME_ICONS[key] || ''}</svg>`;
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            try { localStorage.setItem('pref-theme', theme); } catch (e) {}

            const btnIcon = document.getElementById('themeToggleIcon');
            if (btnIcon) btnIcon.innerHTML = themeIconSvg(theme, 'active-theme-icon');

            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === theme);
            });
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('pref-theme'); } catch (e) {}
            const initial = THEMES.some(t => t.key === saved) ? saved : 'dark';

            const picker = document.querySelector('.theme-picker');
            const btn = document.getElementById('themeToggleBtn');
            const menu = document.getElementById('themeMenu');

            menu.innerHTML = THEMES.map(t => `
                <button type="button" class="theme-option" data-theme="${t.key}" role="menuitemradio">
                    ${themeIconSvg(t.key, 'option-icon')}
                    <span class="theme-option-name">${t.name}</span>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" /></svg>
                </button>
            `).join('');

            applyTheme(initial);

            const closeMenu = () => {
                menu.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            menu.addEventListener('click', (e) => {
                const opt = e.target.closest('.theme-option');
                if (!opt) return;
                applyTheme(opt.dataset.theme);
                closeMenu();
            });

            document.addEventListener('click', (e) => {
                if (!picker.contains(e.target)) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });
        }

        async function loadPresentations() {
            const response = await fetch('presentations.json');
            const presentations = await response.json();

            const grid = document.getElementById('presentationsGrid');
            grid.innerHTML = '';

            presentations.forEach(presentation => {
                const card = document.createElement('div');
                card.className = 'presentation-card';
                card.onclick = () => {
                    window.location.href = `presentation.html?id=${presentation.id}`;
                };

                card.innerHTML = `
                    <h2 class="card-title">${presentation.title}</h2>
                    <p class="card-description">${presentation.description}</p>
                    <div class="card-tags">
                        ${presentation.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-meta">
                        <span class="slide-count">${presentation.slides.length} slides</span>
                        <button class="view-btn" onclick="event.stopPropagation(); window.location.href='presentation.html?id=${presentation.id}'">View</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        initTheme();
        loadPresentations();
    </script>
</body>
</html>
