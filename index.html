<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentations</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('pref-theme') === 'light') {
                    document.documentElement.classList.add('app-light');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --black: #000000;
            --white: #F5F5F2;
            --grey-1: #1A1A1A;
            --grey-2: #252525;
            --grey-3: #666666;
            --grey-4: #A3A3A3;
            --line: rgba(245, 245, 242, 0.16);
            --line-hover: rgba(245, 245, 242, 0.3);
        }

        html.app-light {
            --black: #F5F5F2;
            --white: #101010;
            --grey-1: #ECECE9;
            --grey-2: #E2E2DE;
            --grey-3: #666666;
            --grey-4: #595959;
            --line: rgba(0, 0, 0, 0.12);
            --line-hover: rgba(0, 0, 0, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            transition: background 0.2s ease, color 0.2s ease;
        }

        header {
            padding: 60px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            font-size: clamp(40px, 6vw, 72px);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 18px;
            color: var(--grey-4);
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .theme-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle-btn .icon-moon {
            display: block;
        }

        .theme-toggle-btn .icon-sun {
            display: none;
        }

        html.app-light .theme-toggle-btn .icon-moon {
            display: none;
        }

        html.app-light .theme-toggle-btn .icon-sun {
            display: block;
        }

        .presentations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 20px 40px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .presentation-card {
            background: var(--grey-1);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .presentation-card:hover {
            transform: translateY(-4px);
            border-color: var(--line-hover);
            background: var(--grey-2);
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-description {
            color: var(--grey-4);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .tag {
            font-size: 11px;
            letter-spacing: 0.05em;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--grey-4);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .slide-count {
            font-size: 13px;
            color: var(--grey-4);
        }

        .view-btn {
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .view-btn:hover {
            background: var(--white);
            color: var(--black);
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Presentations</h1>
            <p class="subtitle">Browse and view your presentation decks</p>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle light/dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
        </button>
    </header>

    <div class="presentations-grid" id="presentationsGrid">
        <!-- Presentations will be rendered here -->
    </div>

    <script>
        function applyTheme(theme) {
            document.documentElement.classList.toggle('app-light', theme === 'light');
            try { localStorage.setItem('pref-theme', theme); } catch (e) {}
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('pref-theme'); } catch (e) {}
            applyTheme(saved === 'light' ? 'light' : 'dark');

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                const isLight = document.documentElement.classList.contains('app-light');
                applyTheme(isLight ? 'dark' : 'light');
            });
        }

        async function loadPresentations() {
            const response = await fetch('presentations.json');
            const presentations = await response.json();

            const grid = document.getElementById('presentationsGrid');
            grid.innerHTML = '';

            presentations.forEach(presentation => {
                const card = document.createElement('div');
                card.className = 'presentation-card';
                card.onclick = () => {
                    window.location.href = `presentation.html?id=${presentation.id}`;
                };

                card.innerHTML = `
                    <h2 class="card-title">${presentation.title}</h2>
                    <p class="card-description">${presentation.description}</p>
                    <div class="card-tags">
                        ${presentation.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-meta">
                        <span class="slide-count">${presentation.slides.length} slides</span>
                        <button class="view-btn" onclick="event.stopPropagation(); window.location.href='presentation.html?id=${presentation.id}'">View</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        initTheme();
        loadPresentations();
    </script>
</body>
</html>
