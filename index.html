        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            transition: background 0.2s ease, color 0.2s ease;
        }

        header {
            padding: 60px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(40px, 6vw, 72px);
            font-weight: var(--display-weight);
            margin-bottom: 12px;
            letter-spacing: var(--display-tracking);
            text-transform: var(--display-case);
        }

        .subtitle {
            font-size: 18px;
            color: var(--grey-4);
        }

        .theme-picker {
            position: relative;
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .theme-toggle-btn .active-theme-icon {
            width: 18px;
            height: 18px;
        }

        .theme-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 190px;
            max-height: min(70vh, 480px);
            overflow-y: auto;
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 20;
        }

        .theme-menu.open {
            display: flex;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .theme-option:hover {
            background: var(--grey-1);
        }

        .theme-option.active {
            font-weight: 700;
        }

        .theme-option .option-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .theme-option-name {
            flex: 1;
        }

        .theme-option .check {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0;
        }

        .theme-option.active .check {
            opacity: 1;
        }

        .presentations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 20px 40px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .presentation-card {
            background: var(--grey-1);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .presentation-card:hover {
            transform: translateY(-4px);
            border-color: var(--line-hover);
            background: var(--grey-2);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-description {
            color: var(--grey-4);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .tag {
            font-size: 11px;
            letter-spacing: 0.05em;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--grey-4);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .slide-count {
            font-size: 13px;
            color: var(--grey-4);
        }

        .view-btn {
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .view-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        /* ===== ACCESSIBILITY =====
           Placed last so html[data-dyslexia-font] reliably beats every
           theme's own --font-body (same specificity, later source wins). */
        *:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 2px;
            border-radius: 4px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        .skip-link {
            position: fixed;
            top: -100px;
            left: 16px;
            background: var(--white);
            color: var(--black);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            z-index: 2000;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 16px;
        }

        html[data-contrast="high"] {
            filter: contrast(1.25);
        }

        html[data-reduced-motion="true"] *,
        html[data-reduced-motion="true"] *::before,
        html[data-reduced-motion="true"] *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        html[data-dyslexia-font="true"] {
            --font-body: 'Atkinson Hyperlegible', -apple-system, sans-serif;
        }

        .a11y-reading {
            background-color: color-mix(in srgb, var(--white) 22%, transparent);
            outline: 2px solid var(--white);
            outline-offset: 2px;
            border-radius: 3px;
        }

        .a11y-widget {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 1003;
        }

        .a11y-toggle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--white);
            background: var(--black);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .a11y-toggle-btn:hover {
            transform: scale(1.06);
        }

        .a11y-toggle-btn svg {
            width: 22px;
            height: 22px;
        }

        .a11y-panel {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 300px;
            max-width: calc(100vw - 3rem);
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            display: none;
            overflow: hidden;
        }

        .a11y-panel.open {
            display: block;
        }

        .a11y-panel-header {
            padding: 14px 16px;
            background: var(--grey-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .a11y-panel-header p {
            margin: 0;
        }

        .a11y-panel-title {
            font-size: 14px;
            font-weight: 800;
        }

        .a11y-panel-subtitle {
            font-size: 11px;
            color: var(--grey-4);
            margin-top: 2px !important;
        }

        .a11y-reset-btn {
            font-size: 11px;
            font-weight: 700;
            color: var(--white);
            background: color-mix(in srgb, var(--white) 15%, transparent);
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .a11y-panel-body {
            padding: 4px 16px 14px;
        }

        .a11y-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }

        .a11y-row:last-of-type {
            border-bottom: none;
        }

        .a11y-row-label {
            font-size: 12px;
            font-weight: 600;
        }

        .a11y-btn-group {
            display: flex;
            gap: 4px;
        }

        .a11y-choice-btn {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1.5px solid var(--line);
            background: transparent;
            color: var(--grey-4);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .a11y-choice-btn.active {
            border-color: var(--white);
            background: var(--white);
            color: var(--black);
        }

        .a11y-size-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .a11y-switch {
            width: 40px;
            height: 22px;
            border-radius: 20px;
            border: none;
            background: var(--grey-1);
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .a11y-switch.on {
            background: var(--white);
        }

        .a11y-switch-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--grey-4);
            transition: left 0.15s ease;
        }

        .a11y-switch.on .a11y-switch-knob {
            left: 20px;
            background: var(--black);
        }

        .a11y-tts-buttons {
            display: flex;
            gap: 6px;
        }

        .a11y-tts-btn {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1.5px solid var(--white);
            background: transparent;
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .a11y-tts-btn.active {
            background: var(--white);
            color: var(--black);
        }

        .a11y-tts-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .a11y-panel-footer {
            padding-top: 6px;
            font-size: 10.5px;
            color: var(--grey-4);
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="#presentationsGrid" class="skip-link">Skip to main content</a>

    <div class="a11y-widget">
        <button class="a11y-toggle-btn" id="a11yToggleBtn" aria-haspopup="true" aria-expanded="false" aria-label="Accessibility settings" title="Accessibility settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="1" fill="currentColor" stroke="none" />
                <path d="M9 20l1-5H8l1-4a2 2 0 012-1h2a2 2 0 012 1l1 4h-2l1 5" />
                <path d="M7 9a5 5 0 0110 0" />
            </svg>
        </button>
        <div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Accessibility settings">
            <div class="a11y-panel-header">
                <div>
                    <p class="a11y-panel-title">Accessibility</p>
                    <p class="a11y-panel-subtitle">Adjust your experience</p>
                </div>
                <button class="a11y-reset-btn" id="a11yResetBtn">Reset</button>
            </div>
            <div class="a11y-panel-body">
                <div class="a11y-row">
                    <span class="a11y-row-label">Text Size</span>
                    <div class="a11y-btn-group" id="a11yFontSizeGroup">
                        <button class="a11y-choice-btn a11y-size-btn" data-size="normal" style="font-size:11px;" aria-label="Normal text size">A</button>
                        <button class="a11y-choice-btn a11y-size-btn" data-size="large" style="font-size:13px;" aria-label="Large text size">A</button>
                        <button class="a11y-choice-btn a11y-size-btn" data-size="xlarge" style="font-size:15px;" aria-label="Extra large text size">A</button>
                    </div>
                </div>
                <div class="a11y-row">
                    <span class="a11y-row-label">Contrast</span>
                    <div class="a11y-btn-group" id="a11yContrastGroup">
                        <button class="a11y-choice-btn" data-contrast="normal">Normal</button>
                        <button class="a11y-choice-btn" data-contrast="high">High</button>
                    </div>
                </div>
                <div class="a11y-row">
                    <span class="a11y-row-label">Reduce Motion</span>
                    <button class="a11y-switch" id="a11yReducedMotionBtn" role="switch" aria-checked="false"><span class="a11y-switch-knob"></span></button>
                </div>
                <div class="a11y-row">
                    <span class="a11y-row-label">Easy-read Font</span>
                    <button class="a11y-switch" id="a11yDyslexiaBtn" role="switch" aria-checked="false"><span class="a11y-switch-knob"></span></button>
                </div>
                <div class="a11y-row">
                    <span class="a11y-row-label">Read Page Aloud</span>
                    <div class="a11y-tts-buttons">
                        <button class="a11y-tts-btn" id="a11yListenBtn">Listen</button>
                        <button class="a11y-tts-btn" id="a11yStopBtn" disabled>Stop</button>
                    </div>
                </div>
                <div class="a11y-panel-footer">Settings are saved automatically</div>
            </div>
        </div>
    </div>

    <header>
        <div>
            <h1>Presentations</h1>
            <p class="subtitle">Browse and view your presentation decks</p>
        </div>
        <div class="theme-picker">
            <button class="theme-toggle-btn" id="themeToggleBtn" aria-haspopup="true" aria-expanded="false" aria-label="Choose theme">
                <span id="themeToggleIcon"></span>
            </button>
            <div class="theme-menu" id="themeMenu" role="menu"></div>
        </div>
    </header>

    <div class="presentations-grid" id="presentationsGrid">
        <!-- Presentations will be rendered here -->
    </div>

    <script>
        const THEME_ICONS = {
            dark: '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />',
            light: '<circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />',
            'midnight-navy': '<path d="M12 2l2.9 6.3L22 9.3l-5 4.9L18.2 21 12 17.3 5.8 21 7 14.2l-5-4.9 7.1-1L12 2z" />',
            espresso: '<path d="M3 8h13v6a5 5 0 01-5 5H8a5 5 0 01-5-5V8z" /><path d="M16 9h1.5a2.5 2.5 0 010 5H16" /><path d="M6 2v2M10 2v2" />',
            pine: '<path d="M12 3L6 12h3l-4 7h5v2h4v-2h5l-4-7h3L12 3z" />',
            parchment: '<path d="M12 19l7-7a5 5 0 00-7-7l-7 7v7h7z" /><path d="M8 15l7-7" />',
            'slate-mist': '<path d="M6.5 19a4.5 4.5 0 01-1.5-8.74A6 6 0 0117 8.5a4.5 4.5 0 01-.5 9H6.5z" />',
            editorial: '<path d="M2 5c3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0V5z" /><path d="M20 5c-3-1.5-6-1.5-9 0v14c3-1.5 6-1.5 9 0V5z" />',
            'swiss-grid': '<path d="M3 9h18M3 15h18M9 3v18M15 3v18" />',
            terminal: '<rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 10l3 2-3 2M13 14h4" />',
            'bodoni-luxe': '<path d="M12 2l9 6-9 13L3 8z" /><path d="M3 8h18M8 8l4 13 4-13" />',
            'studio-sans': '<path d="M12 2l9 5v10l-9 5-9-5V7z" /><path d="M3 7l9 5 9-5M12 12v9" />',
            'academic-press': '<path d="M12 3L2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.5 3 6 3s6-1.5 6-3v-5.5" />',
            'poster-condensed': '<path d="M3 10v4l4 1V9l-4 1z" /><path d="M7 9.5l10-3v11l-10-3" /><path d="M9 17l1 3" />',
            'rounded-studio': '<circle cx="12" cy="12" r="9" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><path d="M9 9h.01M15 9h.01" />',
            blueprint: '<circle cx="12" cy="12" r="8" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" />',
            'slab-authority': '<path d="M4 21h16M6 21V9l6-5 6 5v12M9 21v-6h6v6" />',
            ledger: '<rect x="4" y="3" width="16" height="18" rx="1" /><path d="M8 3v18M12 8h6M12 12h6M12 16h6" />',
            meridian: '<circle cx="12" cy="12" r="9" /><path d="M12 3a15 15 0 010 18M3 12h18" />',
            masthead: '<rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 9h18M7 13h4M7 16h4" />',
            'dog-ear': '<path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" /><path d="M15 3v5h5" />',
            duet: '<circle cx="9" cy="12" r="6" /><circle cx="15" cy="12" r="6" />'
        };

        const THEMES = [
            { key: 'dark', name: 'Dark' },
            { key: 'light', name: 'White' },
            { key: 'midnight-navy', name: 'Midnight Navy' },
            { key: 'espresso', name: 'Espresso' },
            { key: 'pine', name: 'Pine' },
            { key: 'parchment', name: 'Parchment' },
            { key: 'slate-mist', name: 'Slate Mist' },
            { key: 'editorial', name: 'Editorial' },
            { key: 'swiss-grid', name: 'Swiss Grid' },
            { key: 'terminal', name: 'Terminal' },
            { key: 'bodoni-luxe', name: 'Bodoni Luxe' },
            { key: 'studio-sans', name: 'Studio Sans' },
            { key: 'academic-press', name: 'Academic Press' },
            { key: 'poster-condensed', name: 'Poster Condensed' },
            { key: 'rounded-studio', name: 'Rounded Studio' },
            { key: 'blueprint', name: 'Blueprint' },
            { key: 'slab-authority', name: 'Slab Authority' },
            { key: 'ledger', name: 'Ledger' },
            { key: 'meridian', name: 'Meridian' },
            { key: 'masthead', name: 'Masthead' },
            { key: 'dog-ear', name: 'Dog-ear' },
            { key: 'duet', name: 'Duet' }
        ];

        function themeIconSvg(key, cls) {
            return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${THEME_ICONS[key] || ''}</svg>`;
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            try { localStorage.setItem('pref-theme', theme); } catch (e) {}

            const btnIcon = document.getElementById('themeToggleIcon');
            if (btnIcon) btnIcon.innerHTML = themeIconSvg(theme, 'active-theme-icon');

            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === theme);
            });
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('pref-theme'); } catch (e) {}
            const initial = THEMES.some(t => t.key === saved) ? saved : 'dark';

            const picker = document.querySelector('.theme-picker');
            const btn = document.getElementById('themeToggleBtn');
            const menu = document.getElementById('themeMenu');

            menu.innerHTML = THEMES.map(t => `
                <button type="button" class="theme-option" data-theme="${t.key}" role="menuitemradio">
                    ${themeIconSvg(t.key, 'option-icon')}
                    <span class="theme-option-name">${t.name}</span>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" /></svg>
                </button>
            `).join('');

            applyTheme(initial);

            const closeMenu = () => {
                menu.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            menu.addEventListener('click', (e) => {
                const opt = e.target.closest('.theme-option');
                if (!opt) return;
                applyTheme(opt.dataset.theme);
                closeMenu();
            });

            document.addEventListener('click', (e) => {
                if (!picker.contains(e.target)) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });
        }

        async function loadPresentations() {
            const response = await fetch('presentations.json');
            const presentations = await response.json();

            const grid = document.getElementById('presentationsGrid');
            grid.innerHTML = '';

            presentations.forEach(presentation => {
                const card = document.createElement('div');
                card.className = 'presentation-card';
                card.onclick = () => {
                    window.location.href = `presentation.html?id=${presentation.id}`;
                };

                card.innerHTML = `
                    <h2 class="card-title">${presentation.title}</h2>
                    <p class="card-description">${presentation.description}</p>
                    <div class="card-tags">
                        ${presentation.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-meta">
                        <span class="slide-count">${presentation.slides.length} slides</span>
                        <button class="view-btn" onclick="event.stopPropagation(); window.location.href='presentation.html?id=${presentation.id}'">View</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Accessibility
        const A11Y_DEFAULTS = { fontSize: 'normal', contrast: 'normal', reducedMotion: false, dyslexiaFont: false };
        let a11yPrefs = { ...A11Y_DEFAULTS };
        const tts = {
            synth: ('speechSynthesis' in window) ? window.speechSynthesis : null,
            elements: [],
            index: 0,
            active: false,
            paused: false
        };

        function loadA11yPrefs() {
            try {
                const saved = JSON.parse(localStorage.getItem('a11y-prefs') || 'null');
                if (saved) a11yPrefs = { ...A11Y_DEFAULTS, ...saved };
            } catch (e) {}
        }

        function saveA11yPrefs() {
            try { localStorage.setItem('a11y-prefs', JSON.stringify(a11yPrefs)); } catch (e) {}
        }

        function setSwitch(id, on) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.classList.toggle('on', on);
            btn.setAttribute('aria-checked', on ? 'true' : 'false');
        }

        function applyA11yPrefs() {
            const root = document.documentElement;
            root.style.zoom = a11yPrefs.fontSize === 'xlarge' ? '1.3' : a11yPrefs.fontSize === 'large' ? '1.15' : '';

            if (a11yPrefs.contrast === 'high') root.setAttribute('data-contrast', 'high');
            else root.removeAttribute('data-contrast');

            if (a11yPrefs.reducedMotion) root.setAttribute('data-reduced-motion', 'true');
            else root.removeAttribute('data-reduced-motion');

            if (a11yPrefs.dyslexiaFont) root.setAttribute('data-dyslexia-font', 'true');
            else root.removeAttribute('data-dyslexia-font');

            saveA11yPrefs();

            document.querySelectorAll('#a11yFontSizeGroup .a11y-choice-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.size === a11yPrefs.fontSize);
            });
            document.querySelectorAll('#a11yContrastGroup .a11y-choice-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.contrast === a11yPrefs.contrast);
            });
            setSwitch('a11yReducedMotionBtn', a11yPrefs.reducedMotion);
            setSwitch('a11yDyslexiaBtn', a11yPrefs.dyslexiaFont);
        }

        function getReadableElements(container) {
            const selector = 'h1, h2, h3, h4, p, li, div, span';
            const nodes = Array.from(container.querySelectorAll(selector));
            return nodes.filter((el) => {
                const text = (el.textContent || '').trim();
                if (text.length < 2) return false;
                if (el.querySelector(selector)) return false;
                return true;
            });
        }

        function clearReadingHighlight() {
            tts.elements.forEach(el => el.classList.remove('a11y-reading'));
        }

        function updateTtsButtons() {
            const listenBtn = document.getElementById('a11yListenBtn');
            const stopBtn = document.getElementById('a11yStopBtn');
            if (!listenBtn || !stopBtn) return;
            listenBtn.textContent = tts.paused ? 'Resume' : tts.active ? 'Pause' : 'Listen';
            listenBtn.classList.toggle('active', tts.active && !tts.paused);
            listenBtn.disabled = !tts.synth;
            stopBtn.disabled = !tts.active;
        }

        function stopSpeech() {
            tts.active = false;
            tts.paused = false;
            clearReadingHighlight();
            if (tts.synth) tts.synth.cancel();
            updateTtsButtons();
        }

        function speakFrom(idx) {
            if (!tts.synth) return;
            if (idx >= tts.elements.length) { stopSpeech(); return; }

            tts.index = idx;
            tts.active = true;
            clearReadingHighlight();

            const el = tts.elements[idx];
            const text = (el.textContent || '').trim();
            if (!text) { speakFrom(idx + 1); return; }

            el.classList.add('a11y-reading');
            el.scrollIntoView({ block: 'center', behavior: a11yPrefs.reducedMotion ? 'auto' : 'smooth' });

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            const voices = tts.synth.getVoices();
            const englishVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            utterance.onend = () => { if (tts.active) speakFrom(idx + 1); };
            tts.synth.speak(utterance);
            updateTtsButtons();
        }

        function toggleListen() {
            if (!tts.synth) return;
            if (!tts.active) {
                const main = document.getElementById('presentationsGrid');
                if (!main) return;
                tts.elements = getReadableElements(main);
                if (tts.elements.length === 0) return;
                speakFrom(0);
            } else if (tts.synth.paused) {
                tts.synth.resume();
                tts.paused = false;
                updateTtsButtons();
            } else {
                tts.synth.pause();
                tts.paused = true;
                updateTtsButtons();
            }
        }

        function initAccessibility() {
            loadA11yPrefs();

            const btn = document.getElementById('a11yToggleBtn');
            const panel = document.getElementById('a11yPanel');
            const widget = document.querySelector('.a11y-widget');

            applyA11yPrefs();
            updateTtsButtons();

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = panel.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            document.addEventListener('click', (e) => {
                if (!widget.contains(e.target)) panel.classList.remove('open');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') panel.classList.remove('open');
            });

            document.querySelectorAll('#a11yFontSizeGroup .a11y-choice-btn').forEach(b => {
                b.addEventListener('click', () => { a11yPrefs.fontSize = b.dataset.size; applyA11yPrefs(); });
            });
            document.querySelectorAll('#a11yContrastGroup .a11y-choice-btn').forEach(b => {
                b.addEventListener('click', () => { a11yPrefs.contrast = b.dataset.contrast; applyA11yPrefs(); });
            });
            document.getElementById('a11yReducedMotionBtn').addEventListener('click', () => {
                a11yPrefs.reducedMotion = !a11yPrefs.reducedMotion;
                applyA11yPrefs();
            });
            document.getElementById('a11yDyslexiaBtn').addEventListener('click', () => {
                a11yPrefs.dyslexiaFont = !a11yPrefs.dyslexiaFont;
                applyA11yPrefs();
            });
            document.getElementById('a11yResetBtn').addEventListener('click', () => {
                a11yPrefs = { ...A11Y_DEFAULTS };
                applyA11yPrefs();
                stopSpeech();
            });
            document.getElementById('a11yListenBtn').addEventListener('click', toggleListen);
            document.getElementById('a11yStopBtn').addEventListener('click', stopSpeech);
        }

        initTheme();
        initAccessibility();
        loadPresentations();
    </script>
</body>
</html>
