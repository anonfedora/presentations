<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('pref-theme');
                var known = ['light', 'midnight-navy', 'espresso', 'pine', 'parchment', 'slate-mist', 'editorial', 'swiss-grid', 'terminal', 'bodoni-luxe', 'studio-sans', 'academic-press', 'poster-condensed', 'rounded-studio', 'blueprint', 'slab-authority', 'ledger', 'meridian', 'masthead', 'dog-ear', 'duet'];
                if (saved && known.indexOf(saved) !== -1) {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.5.2/qrcode.min.js" integrity="sha512-c3HC2N32Up+KwxhFN2dZkoDWSdxWqwzDJCnroUffjS/HBQHf5Ou1uFpqIT0rOIJ5fW8TxHmUpCDndH2A6xNhpQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=Archivo:wght@900&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&family=Bodoni+Moda:opsz,wght@6..96,600&family=Jost:wght@400;500&family=Sora:wght@700&family=Manrope:wght@400;500&family=Crimson+Pro:wght@400;500&family=Big+Shoulders+Display:wght@700&family=Karla:wght@400;500&family=Figtree:wght@700&family=Nunito+Sans:wght@400;500&family=Space+Mono:wght@700&family=IBM+Plex+Sans:wght@400;500&family=Roboto+Slab:wght@700&family=Source+Sans+3:wght@400;500&family=Lora:wght@700&family=PT+Serif:wght@400;700&family=Unbounded:wght@700&family=Rubik:wght@400;500&family=Bitter:wght@700&family=Noto+Serif:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Mulish:wght@400;500&family=Instrument+Serif&family=Albert+Sans:wght@400;500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #F5F5F2;
            --grey-1: #1A1A1A;
            --grey-2: #1C1C1C;
            --grey-3: #454545;
            --grey-4: #A3A3A3;
            --grey-5: #D9D9D6;
            --line: rgba(245, 245, 242, 0.16);
            --line-dark: rgba(0, 0, 0, 0.14);
            --ease: cubic-bezier(.16, .8, .24, 1);
            /* Theme-adaptive tokens: used by inline slide-content styles so they
               automatically flip when a slide (or the whole app) is in light mode. */
            --muted: var(--grey-4);
            --muted-soft: var(--grey-5);
            --panel: var(--grey-1);
            --accent: var(--white);
            --accent-contrast: var(--black);
            /* Typography tokens: redefined per theme so display/body faces,
               weight, tracking and case all change together with the palette. */
            --font-display: 'Archivo Black', 'Arial Narrow Bold', Impact, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --display-weight: 900;
            --display-tracking: -0.01em;
            --display-case: uppercase;
            --display-line-height: 0.92;
            /* "Split ground" accent layer: a no-op for every normal theme. */
            --slide-accent: transparent;
            --slide-accent-clip: none;
        }

        :is(.slide.light, html[data-theme="light"] .slide) {
            --line: var(--line-dark);
            --muted: var(--grey-3);
            --muted-soft: var(--grey-2);
            --panel: var(--grey-5);
            --accent: var(--black);
            --accent-contrast: var(--white);
        }

        /* ===== ALTERNATE THEMES =====
           Each block fully redefines the same token set the base dark
           theme declares above (--black/--white/--grey-1…5/--line/
           --line-dark). Every rule in this file is already built on those
           tokens, so a theme needs nothing else — the existing .slide /
           .slide.light pairing (and the --muted/--panel/--accent tokens
           derived from it) keeps working unchanged, just with a new
           palette. --black is always the default slide's background and
           --white its text, even on the two light-leaning themes below,
           where --black therefore holds the light color. */
        html[data-theme="midnight-navy"] {
            --black: #0B0F17;
            --white: #E6E9F0;
            --grey-1: #141A24;
            --grey-2: #12161F;
            --grey-3: #4C5568;
            --grey-4: #8891A3;
            --grey-5: #C7CCDA;
            --line: rgba(230, 233, 240, 0.16);
            --line-dark: rgba(11, 15, 23, 0.14);
        }

        html[data-theme="espresso"] {
            --black: #1C1712;
            --white: #F1E8D9;
            --grey-1: #241E17;
            --grey-2: #221B15;
            --grey-3: #6B5C48;
            --grey-4: #A6957D;
            --grey-5: #D9C9AF;
            --line: rgba(241, 232, 217, 0.16);
            --line-dark: rgba(28, 23, 18, 0.14);
        }

        html[data-theme="pine"] {
            --black: #0E1712;
            --white: #E6EDE7;
            --grey-1: #17221B;
            --grey-2: #172119;
            --grey-3: #4B5C51;
            --grey-4: #83988B;
            --grey-5: #C3D2C7;
            --line: rgba(230, 237, 231, 0.16);
            --line-dark: rgba(14, 23, 18, 0.14);
        }

        html[data-theme="parchment"] {
            --black: #F2ECDC;
            --white: #2A2118;
            --grey-1: #E9E1D0;
            --grey-2: #E4DAC3;
            --grey-3: #B3A688;
            --grey-4: #8C7F68;
            --grey-5: #3C3225;
            --line: rgba(42, 33, 24, 0.14);
            --line-dark: rgba(242, 236, 220, 0.16);
        }

        html[data-theme="slate-mist"] {
            --black: #EDF0F4;
            --white: #1C2431;
            --grey-1: #E3E7EC;
            --grey-2: #E0E4E9;
            --grey-3: #9AA3B0;
            --grey-4: #5E6B7D;
            --grey-5: #2B3547;
            --line: rgba(28, 36, 49, 0.14);
            --line-dark: rgba(237, 240, 244, 0.16);
        }

        /* ===== TYPOGRAPHIC THEMES =====
           Batch two: each theme also swaps --font-display/--font-body (and
           the weight/tracking/case/line-height that go with that face)
           alongside the same color-token pattern as batch one. */
        html[data-theme="editorial"] {
            --black: #F3EFE6;
            --white: #241F1A;
            --grey-1: #EAE4D6;
            --grey-2: #E3DCCB;
            --grey-3: #B7AC98;
            --grey-4: #8A8175;
            --grey-5: #3A322A;
            --line: rgba(36, 31, 26, 0.14);
            --line-dark: rgba(243, 239, 230, 0.16);
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Source Serif 4', Georgia, serif;
            --display-weight: 600;
            --display-tracking: -0.005em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="swiss-grid"] {
            --black: #FFFFFF;
            --white: #0A0A0A;
            --grey-1: #F0F0F0;
            --grey-2: #E8E8E8;
            --grey-3: #999999;
            --grey-4: #6B6B6B;
            --grey-5: #1A1A1A;
            --line: rgba(10, 10, 10, 0.14);
            --line-dark: rgba(255, 255, 255, 0.16);
            --font-display: 'Archivo', 'Arial Narrow Bold', sans-serif;
            --font-body: 'Work Sans', -apple-system, sans-serif;
            --display-weight: 900;
            --display-tracking: -0.02em;
            --display-case: uppercase;
            --display-line-height: 0.95;
        }

        html[data-theme="terminal"] {
            --black: #0B0D0C;
            --white: #D4DED6;
            --grey-1: #15201B;
            --grey-2: #131A16;
            --grey-3: #56645C;
            --grey-4: #7C8C82;
            --grey-5: #B9C7BE;
            --line: rgba(212, 222, 214, 0.16);
            --line-dark: rgba(11, 13, 12, 0.14);
            --font-display: 'JetBrains Mono', 'Courier New', monospace;
            --font-body: 'JetBrains Mono', 'Courier New', monospace;
            --display-weight: 700;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="bodoni-luxe"] {
            --black: #0A0A0A;
            --white: #F3EDE2;
            --grey-1: #171717;
            --grey-2: #1C1C1C;
            --grey-3: #6E6459;
            --grey-4: #9A9086;
            --grey-5: #DAD2C4;
            --line: rgba(243, 237, 226, 0.16);
            --line-dark: rgba(10, 10, 10, 0.14);
            --font-display: 'Bodoni Moda', Georgia, serif;
            --font-body: 'Jost', -apple-system, sans-serif;
            --display-weight: 600;
            --display-tracking: -0.005em;
            --display-case: none;
            --display-line-height: 1.02;
        }

        html[data-theme="studio-sans"] {
            --black: #F5F3F0;
            --white: #201E1C;
            --grey-1: #ECE9E4;
            --grey-2: #E4E0D9;
            --grey-3: #B0A99E;
            --grey-4: #8D8880;
            --grey-5: #34302C;
            --line: rgba(32, 30, 28, 0.13);
            --line-dark: rgba(245, 243, 240, 0.16);
            --font-display: 'Sora', -apple-system, sans-serif;
            --font-body: 'Manrope', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="academic-press"] {
            --black: #EFE6D4;
            --white: #2E2015;
            --grey-1: #E5D9C2;
            --grey-2: #DED0B6;
            --grey-3: #A18F72;
            --grey-4: #8C7A5E;
            --grey-5: #44311F;
            --line: rgba(46, 32, 21, 0.14);
            --line-dark: rgba(239, 230, 212, 0.16);
            --font-display: 'Source Serif 4', Georgia, serif;
            --font-body: 'Crimson Pro', Georgia, serif;
            --display-weight: 700;
            --display-tracking: -0.005em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="poster-condensed"] {
            --black: #17181A;
            --white: #F1F0EC;
            --grey-1: #212325;
            --grey-2: #E3E2DE;
            --grey-3: #6C6F72;
            --grey-4: #8C8F92;
            --grey-5: #C9CBCC;
            --line: rgba(241, 240, 236, 0.16);
            --line-dark: rgba(23, 24, 26, 0.14);
            --font-display: 'Big Shoulders Display', 'Arial Narrow Bold', sans-serif;
            --font-body: 'Karla', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: 0em;
            --display-case: uppercase;
            --display-line-height: 0.95;
        }

        html[data-theme="rounded-studio"] {
            --black: #F6F1EA;
            --white: #2B2724;
            --grey-1: #ECE5DA;
            --grey-2: #E2DACB;
            --grey-3: #B7AC9C;
            --grey-4: #9A9184;
            --grey-5: #3F3934;
            --line: rgba(43, 39, 36, 0.13);
            --line-dark: rgba(246, 241, 234, 0.16);
            --font-display: 'Figtree', -apple-system, sans-serif;
            --font-body: 'Nunito Sans', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="blueprint"] {
            --black: #10151C;
            --white: #EDF1F5;
            --grey-1: #19212B;
            --grey-2: #161D25;
            --grey-3: #566372;
            --grey-4: #6E7C8C;
            --grey-5: #A9B7C4;
            --line: rgba(237, 241, 245, 0.16);
            --line-dark: rgba(16, 21, 28, 0.14);
            --font-display: 'Space Mono', 'Courier New', monospace;
            --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.05;
        }

        html[data-theme="slab-authority"] {
            --black: #1B1815;
            --white: #EDE6D8;
            --grey-1: #262220;
            --grey-2: #211D1A;
            --grey-3: #66604F;
            --grey-4: #8F8676;
            --grey-5: #C9BFA9;
            --line: rgba(237, 230, 216, 0.16);
            --line-dark: rgba(27, 24, 21, 0.14);
            --font-display: 'Roboto Slab', Georgia, serif;
            --font-body: 'Source Sans 3', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.02;
        }

        /* ===== SPLIT-GROUND THEMES =====
           Batch three: the slide background is two zones instead of one
           flat field, via the --slide-accent/--slide-accent-clip pair
           defined above. The accent shape is always confined to a corner,
           edge or padding gutter, so it never sits under the text column
           and no slide template needs to change. Each also gets its own
           font pairing, distinct from every theme before it. */
        html[data-theme="ledger"] {
            --black: #F4EFE3;
            --white: #171A20;
            --grey-1: #EBE5D8;
            --grey-2: #E2DAC7;
            --grey-3: #7D7362;
            --grey-4: #8F8574;
            --grey-5: #302921;
            --line: rgba(23, 26, 32, 0.14);
            --line-dark: rgba(244, 239, 227, 0.16);
            --font-display: 'Lora', Georgia, serif;
            --font-body: 'PT Serif', Georgia, serif;
            --display-weight: 700;
            --display-tracking: -0.005em;
            --display-case: none;
            --display-line-height: 1.05;
            --slide-accent: #171A20;
            --slide-accent-clip: polygon(0 0, 60px 0, 60px 100%, 0 100%);
        }

        html[data-theme="meridian"] {
            --black: #EDEAE3;
            --white: #141A22;
            --grey-1: #E3DFD5;
            --grey-2: #D9D4C6;
            --grey-3: #6E6A61;
            --grey-4: #87837A;
            --grey-5: #262C33;
            --line: rgba(20, 26, 34, 0.14);
            --line-dark: rgba(237, 234, 227, 0.16);
            --font-display: 'Unbounded', sans-serif;
            --font-body: 'Rubik', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: 0em;
            --display-case: uppercase;
            --display-line-height: 0.98;
            --slide-accent: #141A22;
            --slide-accent-clip: polygon(100% 0, 100% 100%, calc(100% - 50px) 100%, calc(100% - 95px) 0);
        }

        html[data-theme="masthead"] {
            --black: #F3EEE2;
            --white: #1B1712;
            --grey-1: #EAE3D3;
            --grey-2: #E0D7C0;
            --grey-3: #6E6250;
            --grey-4: #8C8067;
            --grey-5: #2C261E;
            --line: rgba(27, 23, 18, 0.14);
            --line-dark: rgba(243, 238, 226, 0.16);
            --font-display: 'Bitter', Georgia, serif;
            --font-body: 'Noto Serif', Georgia, serif;
            --display-weight: 700;
            --display-tracking: -0.005em;
            --display-case: uppercase;
            --display-line-height: 0.98;
            --slide-accent: #1B1712;
            --slide-accent-clip: polygon(0 0, 100% 0, 100% 64px, 0 64px);
        }

        html[data-theme="dog-ear"] {
            --black: #18181A;
            --white: #E7E4DE;
            --grey-1: #212123;
            --grey-2: #1D1D1F;
            --grey-3: #565450;
            --grey-4: #8C8B87;
            --grey-5: #C9C6BF;
            --line: rgba(231, 228, 222, 0.16);
            --line-dark: rgba(24, 24, 26, 0.14);
            --font-display: 'Libre Baskerville', Georgia, serif;
            --font-body: 'Mulish', -apple-system, sans-serif;
            --display-weight: 700;
            --display-tracking: -0.005em;
            --display-case: none;
            --display-line-height: 1.05;
            --slide-accent: #7A4B36;
            --slide-accent-clip: polygon(100% 0, 100% 90px, calc(100% - 90px) 0);
        }

        html[data-theme="duet"] {
            --black: #472128;
            --white: #F2E9E7;
            --grey-1: #542831;
            --grey-2: #3A2126;
            --grey-3: #8C6169;
            --grey-4: #B08790;
            --grey-5: #DDC7CB;
            --line: rgba(242, 233, 231, 0.16);
            --line-dark: rgba(71, 33, 40, 0.14);
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-body: 'Albert Sans', -apple-system, sans-serif;
            --display-weight: 400;
            --display-tracking: -0.01em;
            --display-case: none;
            --display-line-height: 1.05;
            --slide-accent: #121212;
            --slide-accent-clip: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: var(--white);
            color: var(--black);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--black);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--grey-3);
        }

        .mono {
            font-family: 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 0.02em;
        }

        .display {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            letter-spacing: var(--display-tracking);
            text-transform: var(--display-case);
            line-height: var(--display-line-height);
        }

        /* ===== NAV / PROGRESS ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: color-mix(in srgb, var(--black) 70%, transparent);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1001;
        }

        body.is-fullscreen .top-nav {
            display: none;
        }

        @media (max-width:900px) {
            .top-nav {
                height: 60px;
                padding: 0 15px;
                background: transparent;
                backdrop-filter: none;
            }

            .progress-rail {
                display: none;
            }

            .download-btn {
                padding: 6px 15px;
                font-size: 11px;
            }

            .back-btn {
                font-size: 12px;
            }

            .progress-rail {
                top: 60px;
            }
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .download-btn {
            font-size: 12px;
            letter-spacing: 0.04em;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .download-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .progress-rail {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--grey-2);
            z-index: 1000;
        }

        .progress-fill {
            height: 100%;
            background: var(--white);
            width: 0%;
            transition: width .15s linear;
        }

        .deck-nav {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 999;
            background: color-mix(in srgb, var(--black) 20%, transparent);
            border: 1px solid color-mix(in srgb, var(--white) 10%, transparent);
            border-radius: 40px;
            padding: 10px 18px;
        }

        .nav-arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .2s var(--ease), transform .2s var(--ease);
        }

        .nav-arrow:hover {
            background: var(--white);
            color: var(--black);
        }

        .nav-arrow:active {
            transform: scale(0.92);
        }

        .nav-arrow svg {
            width: 14px;
            height: 14px;
        }

        .nav-counter {
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--grey-4);
            min-width: 52px;
            text-align: center;
        }

        .nav-counter b {
            color: var(--white);
        }

        .dots {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 998;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--grey-3);
            cursor: pointer;
            transition: all .25s var(--ease);
        }

        .dot.active {
            background: var(--white);
            height: 22px;
            border-radius: 3px;
        }

        @media (max-width:900px) {
            .dots {
                display: none;
            }
        }

        /* ===== SLIDE STRUCTURE ===== */
        .deck {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y proximity;
            padding-top: 48px; /* clearance for fixed header */
            padding-bottom: 120px; /* for bottom nav */
        }

        .slide {
            min-height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 64px 100px 110px;
            background: var(--black);
            color: var(--white);
        }

        /* "Split ground" themes draw a second color zone here, confined to
           a corner/edge/gutter via clip-path so it never sits under text —
           every other theme leaves both tokens at their no-op default. */
        .slide::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: var(--slide-accent);
            clip-path: var(--slide-accent-clip);
        }

        .slide.light {
            --slide-accent: transparent;
        }

        :is(.slide.light, html[data-theme="light"] .slide) {
            background: var(--white);
            color: var(--black);
        }

        .slide-inner {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            font-size: 28px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-weight: 800;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .eyebrow {
            color: var(--grey-3);
        }

        .eyebrow::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            display: inline-block;
        }

        .slide-index {
            position: absolute;
            bottom: 40px;
            left: 100px;
            font-size: 12px;
            color: var(--grey-4);
            letter-spacing: 0.05em;
            z-index: 3;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .slide-index {
            color: var(--grey-3);
        }

        .slide-index b {
            color: var(--white);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .slide-index b {
            color: var(--black);
        }

        @media (max-width:900px) {
            .deck {
                padding-top: 70px;
                padding-bottom: 150px;
                scroll-snap-type: y proximity;
            }

            .slide {
                height: auto;
                min-height: 100vh;
                padding: 36px 20px 50px;
                overflow: visible;
                justify-content: flex-start;
            }

            .slide-inner {
                max-width: 100%;
            }

            .slide-index {
                left: 28px;
                bottom: 24px;
            }

            /* Adjust typography for mobile */
            h1.display {
                font-size: clamp(28px, 8vw, 48px);
            }

            h2.display {
                font-size: clamp(24px, 6vw, 36px);
            }

            .lede {
                font-size: clamp(14px, 3vw, 20px);
            }

            .eyebrow {
                margin-bottom: 20px;
                font-size: 14px;
            }

            .deck-nav {
                padding-bottom: env(safe-area-inset-bottom, 20px);
            }
        }

        /* ===== PULSE SIGNATURE MOTIF ===== */
        .pulse-field {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .pulse-ring {
            position: absolute;
            border: 1px solid var(--line);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.3);
            opacity: 0;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .pulse-ring {
            border-color: var(--line-dark);
        }

        .pulse-ring.animate {
            animation: pulseOut 3.2s var(--ease) infinite;
        }

        @keyframes pulseOut {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0;
            }

            15% {
                opacity: 0.9;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-ring.animate {
                animation: none;
                opacity: 0.15;
                transform: translate(-50%, -50%) scale(0.6);
            }
        }

        /* ===== TYPOGRAPHY SCALE ===== */
        h1.display {
            font-size: clamp(48px, 7.2vw, 118px);
        }

        h2.display {
            font-size: clamp(34px, 5vw, 72px);
        }

        h3.display {
            font-size: clamp(22px, 2.6vw, 34px);
        }

        .lede {
            font-size: clamp(17px, 1.6vw, 26px);
            line-height: 1.55;
            color: var(--grey-5);
            max-width: 640px;
            font-weight: 400;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .lede {
            color: var(--grey-2);
        }

        p.body-text {
            font-size: 16px;
            line-height: 1.65;
            color: var(--grey-4);
        }

        :is(.slide.light, html[data-theme="light"] .slide) p.body-text {
            color: var(--grey-3);
        }

        /* ===== reusable bits ===== */
        .tag-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            letter-spacing: 0.05em;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--grey-4);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tag {
            border-color: var(--line-dark);
            color: var(--grey-3);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--line);
            margin: 36px 0;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .divider {
            background: var(--line-dark);
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border: 1px solid var(--line);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .icon-box {
            border-color: var(--line-dark);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
        }

        /* ===== SLIDE TYPES ===== */

        /* Cover slide */
        .cover-logo-container {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 240px;
        }

        .cover-logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width:900px) {
            .cover-logo-container {
                position: static;
                transform: none;
                width: 100px;
                margin-bottom: 40px;
            }
        }

        .cover-headline {
            font-size: clamp(56px, 9.5vw, 148px);
            line-height: 0.88;
        }

        .cover-sub {
            margin-top: 34px;
            max-width: 680px;
        }

        .cover-meta {
            position: absolute;
            bottom: 40px;
            right: 100px;
            text-align: right;
            font-size: 11px;
            color: var(--grey-4);
            letter-spacing: 0.05em;
            z-index: 3;
        }

        @media (max-width:900px) {
            .cover-meta {
                right: 28px;
            }
        }

        /* Stat grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            margin-top: 50px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .stat-grid {
            background: var(--line-dark);
            border-color: var(--line-dark);
        }

        .stat-cell {
            background: var(--black);
            padding: 34px 30px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .stat-cell {
            background: var(--white);
        }

        .stat-num {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: clamp(30px, 4vw, 52px);
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--grey-4);
            line-height: 1.4;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .stat-label {
            color: var(--grey-3);
        }

        @media (max-width:900px) {
            .stat-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Two column */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            margin-top: 50px;
            align-items: start;
        }

        @media (max-width:900px) {
            .two-col {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .col-card {
            padding-top: 16px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .col-card {
            border-color: var(--line-dark);
        }

        .col-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .col-title {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 22px;
            text-transform: uppercase;
        }

        .point-list {
            list-style: none;
        }

        .point-list li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 14px;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.55;
            color: var(--grey-5);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .point-list li {
            color: var(--grey-2);
        }

        .point-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 14px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--grey-4);
        }

        /* Why it matters grid */
        .why-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            margin-top: 54px;
        }

        @media (max-width:900px) {
            .why-grid {
                grid-template-columns: 1fr;
                gap: 36px;
            }
        }

        .why-item .why-q {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
            color: var(--grey-4);
            font-weight: bold;
        }

        .why-item p {
            font-size: 24px;
            line-height: 1.6;
            color: var(--grey-5);
        }

        /* Vision slide */
        .vision-slide {
            align-items: center;
            text-align: center;
        }

        .vision-text {
            font-size: clamp(38px, 6.5vw, 92px);
            line-height: 1.05;
            max-width: 1100px;
            margin: 0 auto;
        }

        .vision-text .accent-line {
            display: block;
        }

        /* Big numbers */
        .bignum-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            margin-top: 54px;
            background: var(--line);
            border: 1px solid var(--line);
        }

        .bignum-cell {
            background: var(--black);
            padding: 30px 24px;
        }

        .bignum {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: clamp(26px, 3.4vw, 44px);
            margin-bottom: 12px;
        }

        .bignum-desc {
            font-size: 18px;
            color: var(--grey-4);
            line-height: 1.5;
        }

        @media (max-width:1000px) {
            .bignum-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* TAM */
        .tam-stack {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .tam-row {
            display: grid;
            grid-template-columns: 140px 1fr 280px;
            gap: 30px;
            align-items: center;
            padding: 28px 0;
            border-top: 1px solid var(--line);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-row {
            border-color: var(--line-dark);
        }

        .tam-row:last-child {
            border-bottom: 1px solid var(--line);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-row:last-child {
            border-color: var(--line-dark);
        }

        .tam-label {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 20px;
        }

        .tam-bar-track {
            height: 10px;
            background: var(--grey-1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-bar-track {
            background: var(--grey-5);
        }

        .tam-bar-fill {
            height: 100%;
            background: var(--white);
            border-radius: 6px;
            width: 0%;
            transition: width 1.4s var(--ease);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-bar-fill {
            background: var(--black);
        }

        .tam-value {
            font-size: 14px;
            text-align: right;
            color: var(--grey-4);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-value {
            color: var(--grey-3);
        }

        .tam-value b {
            color: var(--white);
            font-size: 20px;
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            display: block;
            margin-bottom: 2px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tam-value b {
            color: var(--black);
        }

        @media (max-width:900px) {
            .tam-row {
                grid-template-columns: 1fr;
                gap: 10px;
                text-align: left;
            }

            .tam-value {
                text-align: left;
            }
        }

        /* Business model */
        .model-flow {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .model-card {
            flex: 1;
            min-width: 260px;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 38px 32px;
            position: relative;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .model-card {
            border-color: var(--line-dark);
        }

        .model-card .icon-box {
            margin-bottom: 22px;
        }

        .model-card h4 {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 18px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .model-card .figure {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 38px;
            margin: 14px 0 6px;
        }

        .model-card p {
            font-size: 18px;
            color: var(--grey-4);
            line-height: 1.5;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .model-card p {
            color: var(--grey-3);
        }

        .model-arrow {
            flex-shrink: 0;
            opacity: 0.5;
        }

        @media (max-width:900px) {
            .model-arrow {
                transform: rotate(90deg);
            }
        }

        /* GTM */
        .phase-track {
            margin-top: 54px;
            position: relative;
        }

        .phase-row {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 30px;
            padding: 30px 0;
            border-top: 1px solid var(--line);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .phase-row {
            border-color: var(--line-dark);
        }

        .phase-row:last-child {
            border-bottom: 1px solid var(--line);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .phase-row:last-child {
            border-color: var(--line-dark);
        }

        .phase-num {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 16px;
            color: var(--grey-4);
            letter-spacing: 0.05em;
            padding-top: 4px;
        }

        .phase-title {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 21px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .phase-points {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .phase-points span {
            font-size: 18px;
            color: var(--grey-5);
            position: relative;
            padding-left: 16px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .phase-points span {
            color: var(--grey-2);
        }

        .phase-points span::before {
            content: '';
            position: absolute;
            left: 0;
            top: 7px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--grey-4);
        }

        .channels-row {
            margin-top: 40px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* Traction */
        .traction-hero {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 60px;
            margin-top: 50px;
            align-items: center;
        }

        @media (max-width:900px) {
            .traction-hero {
                grid-template-columns: 1fr;
            }
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 8px 16px 8px 12px;
            font-size: 16px;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .live-badge {
            border-color: var(--line-dark);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--white);
            animation: livePulse 1.6s ease-in-out infinite;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .live-dot {
            background: var(--black);
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .growth-chart {
            position: relative;
            height: 240px;
            border-left: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 20px 10px 0 10px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .growth-chart {
            border-color: var(--line-dark);
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            height: 100%;
            gap: 18px;
            justify-content: space-around;
        }

        .bar-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            max-width: 60px;
            background: linear-gradient(180deg, var(--white), var(--grey-5));
            border-radius: 4px 4px 0 0;
            height: 0%;
            transition: height 1.2s var(--ease);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .bar {
            background: linear-gradient(180deg, var(--black), var(--grey-2));
        }

        .bar-val {
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            font-size: 16px;
        }

        .bar-cap {
            font-size: 11px;
            color: var(--grey-4);
        }

        /* Roadmap */
        .roadmap-timeline {
            position: relative;
            margin-top: 64px;
            padding-top: 6px;
        }

        .timeline-track {
            position: relative;
            height: 2px;
            background: var(--line);
            margin-bottom: 0;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .timeline-track {
            background: var(--line-dark);
        }

        .timeline-track-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: var(--white);
            transition: width 1.6s var(--ease);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .timeline-track-fill {
            background: var(--black);
        }

        .roadmap-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            position: relative;
        }

        @media (max-width:900px) {
            .roadmap-grid {
                grid-template-columns: 1fr;
                gap: 46px;
            }

            .roadmap-timeline {
                padding-left: 18px;
            }

            .timeline-track {
                position: absolute;
                top: 0;
                left: 18px;
                width: 2px;
                height: 100%;
            }

            .timeline-track-fill {
                width: 2px !important;
                height: 0%;
                top: 0;
                left: 0;
                transition: height 1.6s var(--ease);
            }
        }

        .roadmap-node-wrap {
            display: flex;
            justify-content: flex-start;
            margin-left: -7px;
            margin-top: -7px;
            margin-bottom: 30px;
            position: relative;
        }

        @media (max-width:900px) {
            .roadmap-node-wrap {
                position: absolute;
                left: 0;
                margin: 0;
                top: 0;
            }
        }

        .roadmap-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--black);
            border: 2px solid var(--grey-4);
            position: relative;
            z-index: 2;
            transition: border-color .4s var(--ease), background .4s var(--ease), transform .4s var(--ease);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .roadmap-node {
            background: var(--white);
        }

        .roadmap-node.lit {
            border-color: var(--white);
            background: var(--white);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--white) 15%, transparent);
            transform: scale(1.15);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .roadmap-node.lit {
            border-color: var(--black);
            background: var(--black);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--black) 12%, transparent);
        }

        .roadmap-col {
            padding-right: 36px;
            position: relative;
        }

        @media (max-width:900px) {
            .roadmap-col {
                padding-right: 0;
                padding-left: 36px;
            }
        }

        .roadmap-date {
            font-size: 12px;
            letter-spacing: 0.06em;
            color: var(--grey-4);
            margin-bottom: 8px;

        /* ===== PRINT / SAVE AS PDF =====
           Uses the browser's native print pipeline (the Download PDF button
           calls window.print()) instead of a canvas-rasterization library,
           so fonts, vector text and the current theme's colors print
           exactly as rendered on screen. Each slide is one printed page
           unless its content is taller than a page, in which case it flows
           onto additional pages instead of being clipped. */
        @media print {
            @page {
                size: landscape;
                margin: 0;
            }

            html, body {
                height: auto !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .deck {
                height: auto !important;
                overflow: visible !important;
                scroll-snap-type: none !important;
                padding: 0 !important;
            }

            .slide {
                min-height: 100vh;
                height: auto !important;
                scroll-snap-align: none !important;
                page-break-after: always;
                break-after: page;
                page-break-inside: auto;
                break-inside: auto;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .slide:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* Keep individual cards/rows intact where possible instead of
               splitting them across a page boundary. */
            .model-card, .roadmap-card, .team-card, .stat-cell, .bignum-cell,
            .col-card, .why-item, .faith-biblical-item, .faith-threat-item,
            .faith-ways-item, .faith-practice-card, .faith-ambassador-item,
            .alloc-row, .tam-row, .phase-row, .target-list li, .roadmap-col,
            .live-badge, .growth-chart {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* Decorative infinite animations would otherwise print at
               whatever random frame the page happened to freeze on. */
            .pulse-field {
                display: none !important;
            }

            .live-dot {
                animation: none !important;
                opacity: 1 !important;
            }

            .top-nav, .dots, .progress-rail, .slide-index, .deck-nav,
            .theme-toggle-btn, .transition-toggle-btn, .download-btn, .back-btn {
                display: none !important;
            }

            /* Paginated transition modes use absolute positioning + opacity
               for on-screen animation; printing always needs every slide
               laid out in normal flow regardless of the active mode. */
            .deck.paginated {
                position: static !important;
            }

            .deck.paginated .slide {
                position: relative !important;
                inset: auto !important;
                opacity: 1 !important;
                visibility: visible !important;
                transform: none !important;
                pointer-events: auto !important;
            }
        }

        /* ===== LIGHT MODE (app-wide) ===== */
        html[data-theme="light"],
        html[data-theme="light"] body {
            background: var(--white);
            color: var(--black);
        }

        html[data-theme="light"] ::selection {
            background: var(--black);
            color: var(--white);
        }

        html[data-theme="light"] ::-webkit-scrollbar-track {
            background: var(--white);
        }

        html[data-theme="light"] .top-nav {
            background: color-mix(in srgb, var(--white) 70%, transparent);
        }

        html[data-theme="light"] .back-btn {
            color: var(--black);
        }

        html[data-theme="light"] .download-btn {
            border-color: var(--black);
            color: var(--black);
        }

        html[data-theme="light"] .download-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        html[data-theme="light"] .theme-toggle-btn {
            border-color: var(--black);
            color: var(--black);
        }

        html[data-theme="light"] .theme-toggle-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        html[data-theme="light"] .transition-toggle-btn {
            border-color: var(--black);
            color: var(--black);
        }

        html[data-theme="light"] .transition-toggle-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        html[data-theme="light"] .progress-rail {
            background: var(--grey-5);
        }

        html[data-theme="light"] .progress-fill {
            background: var(--black);
        }

        html[data-theme="light"] .deck-nav {
            background: color-mix(in srgb, var(--white) 60%, transparent);
            border-color: color-mix(in srgb, var(--black) 10%, transparent);
        }

        html[data-theme="light"] .nav-arrow {
            border-color: var(--line-dark);
            color: var(--black);
        }

        html[data-theme="light"] .nav-arrow:hover {
            background: var(--black);
            color: var(--white);
        }

        html[data-theme="light"] .nav-counter {
            color: var(--grey-3);
        }

        html[data-theme="light"] .nav-counter b {
            color: var(--black);
        }

        html[data-theme="light"] .dot {
            background: var(--grey-4);
        }

        html[data-theme="light"] .dot.active {

        @media (max-width:900px) {
            html[data-theme="light"] .top-nav {

        /* ===== THEME PICKER ===== */
        .theme-picker {
            position: relative;
        }

        .theme-toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .theme-toggle-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .theme-toggle-btn .active-theme-icon {
            width: 16px;
            height: 16px;
        }

        .theme-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 190px;
            max-height: min(70vh, 480px);
            overflow-y: auto;
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 1002;
        }

        .theme-menu.open {
            display: flex;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .theme-option:hover {
            background: var(--grey-1);
        }

        .theme-option.active {
            font-weight: 700;
        }

        .theme-option .option-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .theme-option-name {
            flex: 1;
        }

        .theme-option .check {

            height: 14px;

            opacity: 0;
        }

        .theme-option.active .check {

        /* ===== TRANSITION PICKER =====
           Same list/menu pattern as the theme picker, reusing .theme-menu,
           .theme-option, .option-icon, .theme-option-name and .check so the
           two dropdowns stay visually identical; only the toggle button
           gets its own (smaller) size. */
        .transition-picker {
            position: relative;
        }

        .transition-toggle-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--white);
            color: var(--white);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .transition-toggle-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .transition-toggle-btn .active-transition-icon {
            width: 13px;
            height: 13px;
        }

        .transition-menu-divider {
            height: 1px;
            background: var(--line);
            margin: 6px 4px;
        }

        .transition-speed-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--grey-3);
            padding: 2px 10px 6px;
        }

        .transition-speed-row {
            display: flex;
            gap: 4px;
            padding: 0 6px 6px;
        }

        .transition-speed-btn {
            flex: 1;
            border: 1px solid var(--line);
            background: transparent;
            color: inherit;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 0;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .transition-speed-btn:hover {
            background: var(--grey-1);
        }

        .transition-speed-btn.active {
            background: var(--white);
            color: var(--black);
            border-color: var(--white);
            font-weight: 700;
        }

        html[data-theme="light"] .transition-speed-btn.active {
            background: var(--black);
            color: var(--white);
            border-color: var(--black);
        }

        /* ===== PAGINATED SLIDE TRANSITIONS =====
           Only engaged when a non-default transition is selected; the
           default mode leaves .deck/.slide exactly as before (native
           scroll + snap). */
        .deck.paginated {
            position: relative;
            overflow: hidden;
            scroll-snap-type: none;
        }

        .deck.paginated .slide {
            position: absolute;
            inset: 0;
            min-height: 0;
            overflow-y: auto;
            scroll-snap-align: none;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .deck.paginated .slide.slide-active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 2;
        }

        .deck.paginated .slide.slide-stacked {
            visibility: visible;
            z-index: 3;
        }

        .deck.paginated[data-transition="flip"] {
            perspective: 1800px;
        }

        .deck.paginated[data-transition="flip"] .slide {
            backface-visibility: hidden;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ===== ACCESSIBILITY =====
           Placed last so html[data-dyslexia-font] reliably beats every
           theme's own --font-body (same specificity, later source wins). */
        *:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 2px;
            border-radius: 4px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        .skip-link {

            top: -100px;
            left: 16px;
            background: var(--white);
            color: var(--black);
            padding: 10px 20px;

            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            z-index: 2000;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 16px;
        }

        html[data-contrast="high"] {
            filter: contrast(1.25);
        }

        html[data-reduced-motion="true"] *,
        html[data-reduced-motion="true"] *::before,
        html[data-reduced-motion="true"] *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }

        @media (prefers-reduced-motion: reduce) {

                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;

        /* ===== SOROBAN DECK BLOCKS ===== */

        /* Syntax token colors: each mixes a hue into var(--white), the slide's own
           ink color, so contrast against the code block's background tracks the
           active theme instead of being pinned to one palette. */
        .tok-keyword {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #ff6fa0 45%);
            font-weight: 600;
        }

        .tok-type {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #4fd1c5 45%);
        }

        .tok-func {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #61afef 45%);
        }

        .tok-string {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #98c379 45%);
        }

        .tok-number {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #d19a66 45%);
        }

        .tok-macro,
        .tok-attr {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #e5c07b 45%);
        }

        .tok-comment {
            color: var(--grey-4);
            font-style: italic;
        }

        .tok-command {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #61afef 45%);
            font-weight: 600;
        }

        .tok-flag {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #c678dd 45%);
        }

        .tok-placeholder {
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #d19a66 45%);
            font-style: italic;
        }

        /* Hoverable code phrases that open the magnifying-glass note popup. */
        .tok-annotatable {
            cursor: help;
            border-radius: 3px;
            padding: 1px 0;
            border-bottom: 1px dashed color-mix(in srgb, var(--white) 45%, transparent);
            transition: background-color 0.15s ease;
        }

        .tok-annotatable:hover,
        .tok-annotatable:focus-visible {
            background: color-mix(in srgb, var(--white) 18%, transparent);
            outline: none;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .tok-annotatable:hover,
        :is(.slide.light, html[data-theme="light"] .slide) .tok-annotatable:focus-visible {
            background: color-mix(in srgb, var(--black) 12%, transparent);
        }

        /* The popup lives at <body> level (outside any .slide), so it can't rely on
           the .slide.light swap for its own colors — and the color-mix()-based
           .tok-* token colors below need the same fix even though they ARE inside
           .slide, since that swap only overrides the `color` property, not the
           --white/--black custom properties a color-mix() ingredient reads. These
           two tokens carry the right light/dark flip up to :root instead, keyed off
           the explicit "Light" theme. Named themes that bake their own light palette
           into --black/--white (parchment, swiss-grid, …) already work with no
           override, same as the rest of the page. */
        :root {
            --code-popup-bg: color-mix(in srgb, var(--black) 90%, var(--white) 10%);
            --code-popup-fg: var(--white);
        }

        html[data-theme="light"] {
            --code-popup-bg: color-mix(in srgb, var(--white) 90%, var(--black) 10%);
            --code-popup-fg: var(--black);
        }

        #codeMagnifier {

            max-width: 320px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--code-popup-bg);
            box-shadow: 0 16px 40px color-mix(in srgb, var(--black) 40%, transparent);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14.5px;
            line-height: 1.5;
            font-weight: 500;
            color: var(--code-popup-fg);
            opacity: 0;
            transform: translateY(6px) scale(0.96);
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
        }

        #codeMagnifier.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #codeMagnifier .magnifier-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            color: color-mix(in srgb, var(--code-popup-fg) 55%, #61afef 45%);
        }

        /* A rotated square "flap", half-hidden behind the popup (lower z-index),
           so it automatically inherits the exact same fill and border as the
           card instead of needing its own hand-tuned color to stay visible
           against whatever's behind it. */
        #codeMagnifierArrow {
            position: fixed;
            z-index: 79;
            width: 14px;
            height: 14px;
            background: var(--code-popup-bg);
            border: 1px solid var(--line);
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
        }

        #codeMagnifierArrow.visible {
            opacity: 1;
        }

        .soroban-links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px 48px;
            margin-top: 10px;
        }

        @media (max-width:900px) {
            .soroban-links-grid {
                grid-template-columns: 1fr;
            }
        }

        .soroban-link-item a {
            font-size: 19px;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid var(--line);
            padding-bottom: 2px;
        }

        :is(.slide.light, html[data-theme="light"] .slide) .soroban-link-item a {
            color: var(--black);
            border-color: var(--line-dark);
        }

        .soroban-link-item a:hover {
            opacity: 0.7;
        }

        .soroban-link-note {
            margin-top: 4px;
            font-size: 14px;
            color: var(--grey-4);
        }

        :is(.slide.light, html[data-theme="light"] .slide) .soroban-link-note {
            color: var(--grey-3);
        }

        /* Unlike the title/closing slides, this one is top-anchored rather than
           vertically centered — with a big QR code in the mix, true centering
           pushed it further down the slide than the content's own weight suggests. */
        .slide:has(.soroban-qr-page) {
            justify-content: flex-start;
            align-items: center;
            text-align: center;
        }

        .soroban-qr-page {
            width: 100%;
        }

        .soroban-qr-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            margin-top: 8px;
        }

        /* Always white-on-black regardless of theme — a QR code needs fixed high
           contrast to stay scannable, so it can't follow the slide's palette. The
           shadow is a plain neutral tint for the same reason (--black can itself
           be a light color in some themes, e.g. swiss-grid). */
        .soroban-qr-card {
            width: min(420px, 48vw);
            aspect-ratio: 1;
            padding: 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .soroban-qr-card svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .soroban-qr-link {
            font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
            font-size: 17px;
            font-weight: 700;
            color: inherit;
            text-decoration: none;
            border-bottom: 2px solid currentColor;
            padding-bottom: 3px;
            max-width: 90vw;
            word-break: break-all;
            text-align: center;
        }

        .soroban-qr-link:hover {
            opacity: 0.75;
        }
    </style>
</head>
