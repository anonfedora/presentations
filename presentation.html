    <script>
        // Icons
        const icons = {
            users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5L12 3l9 6.5M5 10v9a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1v-9"/></svg>`,
            mobile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>`,
            layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 17l10 5 10-5M2 12l10 5 10-5M12 2L2 7l10 5 10-5-10-5z"/></svg>`,
            'circle-plus': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>`,
            grid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h18M3 17h18M7 3v18M17 3v18"/></svg>`,
            external: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>`
        };

        // Soroban deck: one render function per block `type` (see soroban-intro-slides/README.md),
        // shared by the soroban-title/content/table/code/links slide layouts below.
        function escapeCodeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Minimal token-at-a-time highlighter: at each position, the first rule whose
        // sticky regex matches right there wins and becomes a span; anything no rule
        // claims (operators, unrecognized words) is flushed through as plain escaped text.
        const RUST_RULES = [
            { cls: 'tok-comment', re: /\/\/.*/y },
            { cls: 'tok-attr', re: /#!?\[[^\]]*\]/y },
            { cls: 'tok-string', re: /"(?:[^"\\]|\\.)*"/y },
            { cls: 'tok-macro', re: /[A-Za-z_][A-Za-z0-9_]*!/y },
            { cls: 'tok-number', re: /\b\d+\b/y },
            { cls: 'tok-keyword', re: /\b(?:pub|fn|let|mut|struct|impl|const|use|return|if|else|match|for|while|loop|break|continue|self|Self|as|in|crate|mod|where|unsafe|async|await|move|ref|static|trait|enum|type|dyn|extern)\b/y },
            { cls: 'tok-type', re: /\b[A-Z][A-Za-z0-9_]*\b/y },
            { cls: 'tok-func', re: /\b[a-z_][A-Za-z0-9_]*(?=\()/y },
        ];

        const BASH_RULES = [
            { cls: 'tok-comment', re: /#.*/y },
            { cls: 'tok-string', re: /"(?:[^"\\]|\\.)*"/y },
            { cls: 'tok-placeholder', re: /<[A-Z_][A-Z0-9_]*>/y },
            { cls: 'tok-flag', re: /(?<=^|\s)--?[A-Za-z][A-Za-z0-9-]*/y },
            { cls: 'tok-command', re: /\b(?:stellar|cargo)\b/y },
        ];

        function escapeAttr(s) {
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        }

        function escapeRegExp(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // annotationRules (optional) are tried before the language rules at every
        // position, so a "magnifying glass" note can wrap a whole phrase (e.g.
        // ".extend_ttl(100, 1000)") while its insides still get normal token colors.
        function runTokenizer(line, rules, annotationRules) {
            let out = '';
            let buf = '';
            let pos = 0;
            const flush = () => { if (buf) { out += escapeCodeHtml(buf); buf = ''; } };
            while (pos < line.length) {
                let matched = false;

                if (annotationRules) {
                    for (const ann of annotationRules) {
                        ann.re.lastIndex = pos;
                        const m = ann.re.exec(line);
                        if (m && m.index === pos && m[0].length > 0) {
                            flush();
                            const inner = runTokenizer(m[0], rules, null);
                            out += `<span class="tok-annotatable" data-note="${escapeAttr(ann.note)}" tabindex="0">${inner}</span>`;
                            pos += m[0].length;
                            matched = true;
                            break;
                        }
                    }
                }

                if (!matched) {
                    for (const rule of rules) {
                        rule.re.lastIndex = pos;
                        const m = rule.re.exec(line);
                        if (m && m.index === pos && m[0].length > 0) {
                            flush();
                            out += `<span class="${rule.cls}">${escapeCodeHtml(m[0])}</span>`;
                            pos += m[0].length;
                            matched = true;
                            break;
                        }
                    }
                }

                if (!matched) {
                    buf += line[pos];
                    pos++;
                }
            }
            flush();
            return out;
        }

        function buildAnnotationRules(annotations) {
            if (!annotations || !annotations.length) return null;
            return annotations.map(a => ({
                re: new RegExp(escapeRegExp(a.match), 'y'),
                note: a.note,
            }));
        }

        function highlightCode(line, lang, annotations) {
            const annotationRules = buildAnnotationRules(annotations);
            if (lang === 'rust') return runTokenizer(line, RUST_RULES, annotationRules);
            if (lang === 'bash') return runTokenizer(line, BASH_RULES, annotationRules);
            return escapeCodeHtml(line);
        }

        function renderSorobanBlock(block) {
            switch (block.type) {
                case 'paragraph':
                    return `<p class="soroban-para">${block.text}</p>`;

                case 'bullets':
                    return `<ul class="point-list">${block.items.map(item =>
                        `<li>${item.label ? `<strong>${item.label}</strong> — ${item.text}` : item.text}</li>`
                    ).join('')}</ul>`;

                case 'steps':
                    return `<div class="soroban-steps">${block.items.map((item, i) => `
                        <div class="soroban-step">
                            <div class="soroban-step-num">${String(i + 1).padStart(2, '0')}</div>
                            <div class="soroban-step-title">${item.title}</div>
                            <div class="soroban-step-text">${item.text}</div>
                        </div>
                    `).join('')}</div>`;

                case 'callout':
                    return `<div class="soroban-callout${block.variant === 'warning' ? ' warning' : ''}">${block.text}</div>`;

                case 'table':
                    return `
                        <div class="soroban-table-wrap">
                            <table class="soroban-table">
                                <thead><tr>${block.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                                <tbody>${block.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
                            </table>
                        </div>
                    `;

                case 'code': {
                    const lines = block.content.split('\n');
                    const hl = new Set(block.highlight || []);
                    return `
                        <div class="soroban-code-block">
                            ${block.filename ? `<div class="soroban-code-filename">${
                                block.filenameNote
                                    ? `<span class="tok-annotatable" data-note="${escapeAttr(block.filenameNote)}" tabindex="0">${escapeCodeHtml(block.filename)}</span>`
                                    : escapeCodeHtml(block.filename)
                            }</div>` : ''}
                            <div class="soroban-code-body">
                                ${lines.map((line, i) => `
                                    <div class="soroban-code-row${hl.has(i + 1) ? ' hl' : ''}"><div class="soroban-code-num">${i + 1}</div><div>${line ? highlightCode(line, block.language, block.annotations) : ' '}</div></div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                case 'links':
                    return `<div class="soroban-links-grid">${block.items.map(item => `
                        <div class="soroban-link-item">
                            <a href="${item.url}" target="_blank" rel="noopener">${item.label}</a>
                            ${item.note ? `<div class="soroban-link-note">${item.note}</div>` : ''}
                        </div>
                    `).join('')}</div>`;

                case 'qr': {
                    let svg = '';
                    try {
                        const qr = qrcode(0, 'M');
                        qr.addData(block.url);
                        qr.make();
                        svg = qr.createSvgTag({ scalable: true });
                    } catch (e) {
                        svg = ''; // qrcode-generator failed to load — card still shows the plain link below
                    }
                    return `
                        <div class="soroban-qr-wrap">
                            <div class="soroban-qr-card">${svg}</div>
                            <a class="soroban-qr-link" href="${escapeAttr(block.url)}" target="_blank" rel="noopener">${escapeCodeHtml(block.label || block.url)}</a>
                        </div>
                    `;
                }

                default:
                    return '';
            }
        }

        // Theme
        const THEME_ICONS = {
            dark: '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />',
            light: '<circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />',
            'midnight-navy': '<path d="M12 2l2.9 6.3L22 9.3l-5 4.9L18.2 21 12 17.3 5.8 21 7 14.2l-5-4.9 7.1-1L12 2z" />',
            espresso: '<path d="M3 8h13v6a5 5 0 01-5 5H8a5 5 0 01-5-5V8z" /><path d="M16 9h1.5a2.5 2.5 0 010 5H16" /><path d="M6 2v2M10 2v2" />',
            pine: '<path d="M12 3L6 12h3l-4 7h5v2h4v-2h5l-4-7h3L12 3z" />',
            parchment: '<path d="M12 19l7-7a5 5 0 00-7-7l-7 7v7h7z" /><path d="M8 15l7-7" />',
            'slate-mist': '<path d="M6.5 19a4.5 4.5 0 01-1.5-8.74A6 6 0 0117 8.5a4.5 4.5 0 01-.5 9H6.5z" />',
            editorial: '<path d="M2 5c3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0V5z" /><path d="M20 5c-3-1.5-6-1.5-9 0v14c3-1.5 6-1.5 9 0V5z" />',
            'swiss-grid': '<path d="M3 9h18M3 15h18M9 3v18M15 3v18" />',
            terminal: '<rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 10l3 2-3 2M13 14h4" />',
            'bodoni-luxe': '<path d="M12 2l9 6-9 13L3 8z" /><path d="M3 8h18M8 8l4 13 4-13" />',
            'studio-sans': '<path d="M12 2l9 5v10l-9 5-9-5V7z" /><path d="M3 7l9 5 9-5M12 12v9" />',
            'academic-press': '<path d="M12 3L2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.5 3 6 3s6-1.5 6-3v-5.5" />',
            'poster-condensed': '<path d="M3 10v4l4 1V9l-4 1z" /><path d="M7 9.5l10-3v11l-10-3" /><path d="M9 17l1 3" />',
            'rounded-studio': '<circle cx="12" cy="12" r="9" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><path d="M9 9h.01M15 9h.01" />',
            blueprint: '<circle cx="12" cy="12" r="8" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" />',
            'slab-authority': '<path d="M4 21h16M6 21V9l6-5 6 5v12M9 21v-6h6v6" />',
            ledger: '<rect x="4" y="3" width="16" height="18" rx="1" /><path d="M8 3v18M12 8h6M12 12h6M12 16h6" />',
            meridian: '<circle cx="12" cy="12" r="9" /><path d="M12 3a15 15 0 010 18M3 12h18" />',
            masthead: '<rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 9h18M7 13h4M7 16h4" />',
            'dog-ear': '<path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" /><path d="M15 3v5h5" />',
            duet: '<circle cx="9" cy="12" r="6" /><circle cx="15" cy="12" r="6" />'
        };

        const THEMES = [
            { key: 'dark', name: 'Dark' },
            { key: 'light', name: 'White' },
            { key: 'midnight-navy', name: 'Midnight Navy' },
            { key: 'espresso', name: 'Espresso' },
            { key: 'pine', name: 'Pine' },
            { key: 'parchment', name: 'Parchment' },
            { key: 'slate-mist', name: 'Slate Mist' },
            { key: 'editorial', name: 'Editorial' },
            { key: 'swiss-grid', name: 'Swiss Grid' },
            { key: 'terminal', name: 'Terminal' },
            { key: 'bodoni-luxe', name: 'Bodoni Luxe' },
            { key: 'studio-sans', name: 'Studio Sans' },
            { key: 'academic-press', name: 'Academic Press' },
            { key: 'poster-condensed', name: 'Poster Condensed' },
            { key: 'rounded-studio', name: 'Rounded Studio' },
            { key: 'blueprint', name: 'Blueprint' },
            { key: 'slab-authority', name: 'Slab Authority' },
            { key: 'ledger', name: 'Ledger' },
            { key: 'meridian', name: 'Meridian' },
            { key: 'masthead', name: 'Masthead' },
            { key: 'dog-ear', name: 'Dog-ear' },
            { key: 'duet', name: 'Duet' }
        ];

        function themeIconSvg(key, cls) {
            return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${THEME_ICONS[key] || ''}</svg>`;
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            try { localStorage.setItem('pref-theme', theme); } catch (e) {}

            const btnIcon = document.getElementById('themeToggleIcon');
            if (btnIcon) btnIcon.innerHTML = themeIconSvg(theme, 'active-theme-icon');

            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === theme);
            });
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('pref-theme'); } catch (e) {}
            const initial = THEMES.some(t => t.key === saved) ? saved : 'dark';

            const picker = document.querySelector('.theme-picker');
            const btn = document.getElementById('themeToggleBtn');
            const menu = document.getElementById('themeMenu');

            menu.innerHTML = THEMES.map(t => `
                <button type="button" class="theme-option" data-theme="${t.key}" role="menuitemradio">
                    ${themeIconSvg(t.key, 'option-icon')}
                    <span class="theme-option-name">${t.name}</span>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" /></svg>
                </button>
            `).join('');

            applyTheme(initial);

            const closeMenu = () => {
                menu.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            menu.addEventListener('click', (e) => {
                const opt = e.target.closest('.theme-option');
                if (!opt) return;
                applyTheme(opt.dataset.theme);
                closeMenu();
            });

            document.addEventListener('click', (e) => {
                if (!picker.contains(e.target)) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });
        }

        // Slide transitions
        const TRANSITIONS = [
            { key: 'default', name: 'Default (Scroll)' },
            { key: 'fade', name: 'Fade' },
            { key: 'slide', name: 'Slide' },
            { key: 'zoom', name: 'Zoom' },
            { key: 'flip', name: 'Flip' }
        ];

        const TRANSITION_ICONS = {
            default: '<path d="M12 5v14M5 12l7 7 7-7" />',
            fade: '<circle cx="12" cy="12" r="4" opacity="0.35" /><circle cx="12" cy="12" r="8.5" />',
            slide: '<path d="M3 12h13M11 6l6 6-6 6" /><path d="M21 5v14" />',
            zoom: '<circle cx="11" cy="11" r="7" /><path d="M11 8v6M8 11h6" /><path d="M20.5 20.5L16 16" />',
            flip: '<path d="M12 3v18" /><path d="M5 8.5L2.5 12 5 15.5M19 8.5L21.5 12 19 15.5" />'
        };

        const TRANSITION_SPEEDS = [
            { key: 'slow', name: 'Slow', ms: 900 },
            { key: 'normal', name: 'Normal', ms: 480 },
            { key: 'fast', name: 'Fast', ms: 250 }
        ];

        let TRANSITION_DURATION = 480;
        let transitionType = 'default';
        let transitionSpeed = 'normal';
        let isTransitioningSlide = false;

        const TRANSITION_EFFECTS = {
            fade: {
                incoming: () => ({ opacity: '0', transform: 'none' }),
                outgoing: () => ({ opacity: '0', transform: 'none' }),
                incomingFinal: { opacity: '1', transform: 'none' }
            },
            slide: {
                incoming: (dir) => ({ opacity: '1', transform: dir === 'next' ? 'translateX(100%)' : 'translateX(-100%)' }),
                outgoing: (dir) => ({ opacity: '1', transform: dir === 'next' ? 'translateX(-100%)' : 'translateX(100%)' }),
                incomingFinal: { opacity: '1', transform: 'translateX(0)' }
            },
            zoom: {
                incoming: () => ({ opacity: '0', transform: 'scale(1.08)' }),
                outgoing: () => ({ opacity: '0', transform: 'scale(0.92)' }),
                incomingFinal: { opacity: '1', transform: 'scale(1)' }
            },
            flip: {
                incoming: (dir) => ({ opacity: '0', transform: dir === 'next' ? 'rotateY(18deg)' : 'rotateY(-18deg)' }),
                outgoing: (dir) => ({ opacity: '0', transform: dir === 'next' ? 'rotateY(-18deg)' : 'rotateY(18deg)' }),
                incomingFinal: { opacity: '1', transform: 'rotateY(0deg)' }
            }
        };

        function transitionIconSvg(key, cls) {
            return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${TRANSITION_ICONS[key] || ''}</svg>`;
        }

        function setSlideStyle(el, styles) {
            Object.keys(styles).forEach(k => { el.style[k] = styles[k]; });
        }

        function applyTransitionMode(type) {
            transitionType = type;
            try { localStorage.setItem('pref-transition', type); } catch (e) {}

            deck.classList.toggle('paginated', type !== 'default');

            if (type === 'default') {
                deck.removeAttribute('data-transition');
                slides.forEach(s => {
                    s.classList.remove('slide-active', 'slide-stacked');
                    s.style.cssText = '';
                });
                requestAnimationFrame(() => scrollToSlide(currentIndex));
            } else {
                deck.setAttribute('data-transition', type);
                slides.forEach((s, i) => {
                    s.style.cssText = '';
                    s.classList.remove('slide-stacked');
                    s.classList.toggle('slide-active', i === currentIndex);
                });
            }

            const btnIcon = document.getElementById('transitionToggleIcon');
            if (btnIcon) btnIcon.innerHTML = transitionIconSvg(type, 'active-transition-icon');

            document.querySelectorAll('.transition-option').forEach(el => {
                el.classList.toggle('active', el.dataset.transition === type);
            });
        }

        function applyTransitionSpeed(speed) {
            const match = TRANSITION_SPEEDS.find(s => s.key === speed);
            if (!match) return;

            transitionSpeed = speed;
            TRANSITION_DURATION = match.ms;
            try { localStorage.setItem('pref-transition-speed', speed); } catch (e) {}

            document.querySelectorAll('.transition-speed-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.speed === speed);
            });
        }

        function goToSlidePaginated(index) {
            if (index === currentIndex || isTransitioningSlide || !slides[index]) return;
            const effect = TRANSITION_EFFECTS[transitionType];
            if (!effect) return;

            const dir = index > currentIndex ? 'next' : 'prev';
            const outSlide = slides[currentIndex];
            const inSlide = slides[index];
            isTransitioningSlide = true;

            inSlide.style.transition = 'none';
            inSlide.classList.add('slide-stacked');
            setSlideStyle(inSlide, effect.incoming(dir));
            inSlide.scrollTop = 0;
            void inSlide.offsetHeight;

            currentIndex = index;
            updateUI();

            requestAnimationFrame(() => {
                outSlide.style.transition = `opacity ${TRANSITION_DURATION}ms ease, transform ${TRANSITION_DURATION}ms ease`;
                inSlide.style.transition = `opacity ${TRANSITION_DURATION}ms ease, transform ${TRANSITION_DURATION}ms ease`;
                setSlideStyle(outSlide, effect.outgoing(dir));
                setSlideStyle(inSlide, effect.incomingFinal);
            });

            setTimeout(() => {
                outSlide.classList.remove('slide-active');
                outSlide.style.cssText = '';
                inSlide.classList.remove('slide-stacked');
                inSlide.classList.add('slide-active');
                inSlide.style.cssText = '';
                isTransitioningSlide = false;
            }, TRANSITION_DURATION + 30);
        }

        function initTransitions() {
            let saved = null;
            let savedSpeed = null;
            try {
                saved = localStorage.getItem('pref-transition');
                savedSpeed = localStorage.getItem('pref-transition-speed');
            } catch (e) {}
            const initial = TRANSITIONS.some(t => t.key === saved) ? saved : 'default';
            const initialSpeed = TRANSITION_SPEEDS.some(s => s.key === savedSpeed) ? savedSpeed : 'normal';

            const picker = document.querySelector('.transition-picker');
            const btn = document.getElementById('transitionToggleBtn');
            const menu = document.getElementById('transitionMenu');

            menu.innerHTML = TRANSITIONS.map(t => `
                <button type="button" class="theme-option transition-option" data-transition="${t.key}" role="menuitemradio">
                    ${transitionIconSvg(t.key, 'option-icon')}
                    <span class="theme-option-name">${t.name}</span>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" /></svg>
                </button>
            `).join('') + `
                <div class="transition-menu-divider"></div>
                <div class="transition-speed-label">Speed</div>
                <div class="transition-speed-row">
                    ${TRANSITION_SPEEDS.map(s => `
                        <button type="button" class="transition-speed-btn" data-speed="${s.key}">${s.name}</button>
                    `).join('')}
                </div>
            `;

            applyTransitionMode(initial);
            applyTransitionSpeed(initialSpeed);

            const closeMenu = () => {
                menu.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            menu.addEventListener('click', (e) => {
                const speedBtn = e.target.closest('.transition-speed-btn');
                if (speedBtn) {
                    applyTransitionSpeed(speedBtn.dataset.speed);
                    return;
                }
                const opt = e.target.closest('.transition-option');
                if (!opt) return;
                applyTransitionMode(opt.dataset.transition);
                closeMenu();
            });

            document.addEventListener('click', (e) => {
                if (!picker.contains(e.target)) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });
        }

        // Accessibility
        const A11Y_DEFAULTS = { fontSize: 'normal', contrast: 'normal', reducedMotion: false, dyslexiaFont: false };
        let a11yPrefs = { ...A11Y_DEFAULTS };
        const tts = {
            synth: ('speechSynthesis' in window) ? window.speechSynthesis : null,
            elements: [],
            index: 0,
            active: false,
            paused: false
        };

        function loadA11yPrefs() {
            try {
                const saved = JSON.parse(localStorage.getItem('a11y-prefs') || 'null');
                if (saved) a11yPrefs = { ...A11Y_DEFAULTS, ...saved };
            } catch (e) {}
        }

        function saveA11yPrefs() {
            try { localStorage.setItem('a11y-prefs', JSON.stringify(a11yPrefs)); } catch (e) {}
        }

        function setSwitch(id, on) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.classList.toggle('on', on);
            btn.setAttribute('aria-checked', on ? 'true' : 'false');
        }

        function applyA11yPrefs() {
            const root = document.documentElement;
            root.style.zoom = a11yPrefs.fontSize === 'xlarge' ? '1.3' : a11yPrefs.fontSize === 'large' ? '1.15' : '';

            if (a11yPrefs.contrast === 'high') root.setAttribute('data-contrast', 'high');
            else root.removeAttribute('data-contrast');

            if (a11yPrefs.reducedMotion) root.setAttribute('data-reduced-motion', 'true');
            else root.removeAttribute('data-reduced-motion');

            if (a11yPrefs.dyslexiaFont) root.setAttribute('data-dyslexia-font', 'true');
            else root.removeAttribute('data-dyslexia-font');

            saveA11yPrefs();

            document.querySelectorAll('#a11yFontSizeGroup .a11y-choice-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.size === a11yPrefs.fontSize);
            });
            document.querySelectorAll('#a11yContrastGroup .a11y-choice-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.contrast === a11yPrefs.contrast);
            });
            setSwitch('a11yReducedMotionBtn', a11yPrefs.reducedMotion);
            setSwitch('a11yDyslexiaBtn', a11yPrefs.dyslexiaFont);
        }

        // Picks the innermost text-bearing elements in document order, so a
        // slide's wildly different per-template markup (cards, lists, tags,
        // plain divs) all get read once each, without double-reading a
        // container and its own children.
        function getReadableElements(container) {
            const selector = 'h1, h2, h3, h4, p, li, div, span';
            const nodes = Array.from(container.querySelectorAll(selector));
            return nodes.filter((el) => {
                const text = (el.textContent || '').trim();
                if (text.length < 2) return false;
                if (el.querySelector(selector)) return false;
                return true;
            });
        }

        function clearReadingHighlight() {
            tts.elements.forEach(el => el.classList.remove('a11y-reading'));
        }

        function updateTtsButtons() {
            const listenBtn = document.getElementById('a11yListenBtn');
            const stopBtn = document.getElementById('a11yStopBtn');
            if (!listenBtn || !stopBtn) return;
            listenBtn.textContent = tts.paused ? 'Resume' : tts.active ? 'Pause' : 'Listen';
            listenBtn.classList.toggle('active', tts.active && !tts.paused);
            listenBtn.disabled = !tts.synth;
            stopBtn.disabled = !tts.active;
        }

        function stopSpeech() {
            tts.active = false;
            tts.paused = false;
            clearReadingHighlight();
            if (tts.synth) tts.synth.cancel();
            updateTtsButtons();
        }

        function speakFrom(idx) {
            if (!tts.synth) return;
            if (idx >= tts.elements.length) { stopSpeech(); return; }

            tts.index = idx;
            tts.active = true;
            clearReadingHighlight();

            const el = tts.elements[idx];
            const text = (el.textContent || '').trim();
            if (!text) { speakFrom(idx + 1); return; }

            el.classList.add('a11y-reading');
            el.scrollIntoView({ block: 'nearest', behavior: a11yPrefs.reducedMotion ? 'auto' : 'smooth' });

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            const voices = tts.synth.getVoices();
            const englishVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            utterance.onend = () => { if (tts.active) speakFrom(idx + 1); };
            tts.synth.speak(utterance);
            updateTtsButtons();
        }

        function toggleListen() {
            if (!tts.synth) return;
            if (!tts.active) {
                const activeSlide = slides[currentIndex];
                if (!activeSlide) return;
                tts.elements = getReadableElements(activeSlide);
                if (tts.elements.length === 0) return;
                speakFrom(0);
            } else if (tts.synth.paused) {
                tts.synth.resume();
                tts.paused = false;
                updateTtsButtons();
            } else {
                tts.synth.pause();
                tts.paused = true;
                updateTtsButtons();
            }
        }

        function initAccessibility() {
            loadA11yPrefs();

            const btn = document.getElementById('a11yToggleBtn');
            const panel = document.getElementById('a11yPanel');
            const widget = document.querySelector('.a11y-widget');

            applyA11yPrefs();

            document.addEventListener('click', (e) => {

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') panel.classList.remove('open');
            });

            document.querySelectorAll('#a11yFontSizeGroup .a11y-choice-btn').forEach(b => {
                b.addEventListener('click', () => { a11yPrefs.fontSize = b.dataset.size; applyA11yPrefs(); });
            });

                b.addEventListener('click', () => { a11yPrefs.contrast = b.dataset.contrast; applyA11yPrefs(); });
            });

            });
            document.getElementById('a11yDyslexiaBtn').addEventListener('click', () => {

            });
            document.getElementById('a11yResetBtn').addEventListener('click', () => {

            document.getElementById('a11yListenBtn').addEventListener('click', toggleListen);
            document.getElementById('a11yStopBtn').addEventListener('click', stopSpeech);

        // Shrinks a slide's main heading just enough to fit on one line
        // (down to a sensible floor) instead of wrapping awkwardly. Titles
        // that already contain a manual <br> (deliberate multi-line
        // headlines, e.g. the vision slide) are left untouched, since each
        // authored line already fits on its own.
        function fitHeadlinesToOneLine() {
            document.querySelectorAll('.slide-inner > h2.display').forEach(el => {
                if (el.classList.contains('vision-text')) return;
                const container = el.parentElement;
                if (!container) return;

                el.style.fontSize = '';
                const baseSize = parseFloat(getComputedStyle(el).fontSize);

                const prevWhiteSpace = el.style.whiteSpace;
                el.style.whiteSpace = 'nowrap';
                const naturalWidth = el.scrollWidth;
                const availableWidth = container.clientWidth;
                el.style.whiteSpace = prevWhiteSpace;

                if (naturalWidth > availableWidth) {
                    const minSize = Math.max(20, baseSize * 0.55);
                    const fitted = Math.max(minSize, Math.floor(baseSize * (availableWidth / naturalWidth) * 0.99));
                    el.style.fontSize = fitted + 'px';
                }
            });
        }

        function buildPulseField(containerId, count, cx, cy) {
            const el = document.getElementById(containerId);
            if (!el) return;
            for (let i = 0; i < count; i++) {
                const ring = document.createElement('div');
                ring.className = 'pulse-ring animate';
                const size = 600 + i * 120;
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';
                ring.style.left = cx;
                ring.style.top = cy;
                ring.style.animationDelay = (i * 0.6) + 's';
                el.appendChild(ring);
            }
        }

        function initNavigation() {
            const dotsNav = document.getElementById('dotsNav');
            dotsNav.innerHTML = '';
            slides.forEach((s, i) => {
                const d = document.createElement('div');
                d.className = 'dot' + (i === 0 ? ' active' : '');
                d.addEventListener('click', () => scrollToSlide(i));
                dotsNav.appendChild(d);
            });

            document.getElementById('prevBtn').addEventListener('click', () => {
                const target = Math.max(0, currentIndex - 1);
                scrollToSlide(target);
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                const target = Math.min(slides.length - 1, currentIndex + 1);
                scrollToSlide(target);
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                    e.preventDefault();
                    const target = Math.min(slides.length - 1, currentIndex + 1);
                    scrollToSlide(target);
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    const target = Math.max(0, currentIndex - 1);
                    scrollToSlide(target);
                } else if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.log(`Error attempting to enable fullscreen: ${err.message}`);
                        });
                    } else {
                        document.exitFullscreen();
                    }
                }
            });

            // Hide the top nav (back link, transition/theme pickers,
            // download button) while presenting in fullscreen.
            document.addEventListener('fullscreenchange', () => {
                document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
            });

            deck.addEventListener('scroll', () => {
                window.requestAnimationFrame(updateUI);
            });

            // Paginated (non-default) transition modes replace native
            // scrolling with a wheel/swipe-driven page flip, since the
            // slides are absolutely positioned rather than stacked in flow.
            let wheelLock = false;
            deck.addEventListener('wheel', (e) => {
                if (transitionType === 'default') return;
                e.preventDefault();
                if (wheelLock || isTransitioningSlide || Math.abs(e.deltaY) < 10) return;
                wheelLock = true;
                const target = e.deltaY > 0
                    ? Math.min(slides.length - 1, currentIndex + 1)
                    : Math.max(0, currentIndex - 1);
                scrollToSlide(target);
                setTimeout(() => { wheelLock = false; }, TRANSITION_DURATION + 60);
            }, { passive: false });

            let touchStartY = null;
            deck.addEventListener('touchstart', (e) => {
                if (transitionType === 'default') return;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            deck.addEventListener('touchend', (e) => {
                if (transitionType === 'default' || touchStartY === null || isTransitioningSlide) return;
                const dy = touchStartY - e.changedTouches[0].clientY;
                touchStartY = null;
                if (Math.abs(dy) < 40) return;
                const target = dy > 0
                    ? Math.min(slides.length - 1, currentIndex + 1)
                    : Math.max(0, currentIndex - 1);
                scrollToSlide(target);
            }, { passive: true });

            // Build initial pulse fields
            buildPulseField('pulseVision', 3, '50%', '50%');
            buildPulseField('pulseRaise', 3, '92%', '15%');
            buildPulseField('pulseClosing', 3, '50%', '50%');

            // Download PDF
            document.getElementById('downloadBtn').addEventListener('click', downloadPDF);
        }

        function scrollToSlide(index) {
            index = Math.max(0, Math.min(slides.length - 1, index));
            if (transitionType === 'default') {
                const slide = slides[index];
                const position = slide.offsetTop;
                deck.scrollTo({
                    top: position,
                    behavior: 'smooth'
                });
            } else {
                goToSlidePaginated(index);
            }
        }

        function updateUI() {
            const previousIndex = currentIndex;
            let idx = currentIndex;

            if (transitionType === 'default') {
                const scrollTop = deck.scrollTop;
                // Find current slide by checking which slide's top is closest to scrollTop
                let minDist = Infinity;
                slides.forEach((slide, i) => {
                    const dist = Math.abs(slide.offsetTop - scrollTop);
                    if (dist < minDist) {
                        minDist = dist;
                        idx = i;
                    }
                });
            }

            currentIndex = Math.max(0, Math.min(slides.length - 1, idx));

            if (currentIndex !== previousIndex && typeof stopSpeech === 'function' && tts.active) {
                stopSpeech();
            }

            document.getElementById('curSlide').textContent = String(currentIndex + 1).padStart(2, '0');

            const dotEls = Array.from(document.getElementById('dotsNav').children);
            dotEls.forEach((d, i) => d.classList.toggle('active', i === currentIndex));

            const progress = transitionType === 'default'
                ? deck.scrollTop / (deck.scrollHeight - deck.clientHeight)
                : (slides.length > 1 ? currentIndex / (slides.length - 1) : 0);
            document.getElementById('progressFill').style.width = (Math.max(0, Math.min(1, progress || 0)) * 100) + '%';

            slides.forEach((s, i) => {
                if (i === currentIndex) {
                    s.querySelectorAll('.reveal').forEach(r => r.classList.add('in'));
                    animateSlideExtras(s);
                }
            });
        }

        function animateSlideExtras(slide) {
            slide.querySelectorAll('.bar[data-height]').forEach(b => {
                if (!b.dataset.done) {
                    b.style.height = b.dataset.height + '%';
                    b.dataset.done = '1';
                }
            });
            slide.querySelectorAll('.tam-bar-fill[data-width], .alloc-bar-fill[data-width]').forEach(b => {
                if (!b.dataset.done) {
                    b.style.width = b.dataset.width + '%';
                    b.dataset.done = '1';
                }
            });
            const timelineFill = slide.querySelector('#timelineFill');
            if (timelineFill && !timelineFill.dataset.done) {
                const litNode = slide.querySelector('.roadmap-node.lit');
                const grid = slide.querySelector('.roadmap-grid');
                if (litNode && grid) {
                    const isMobile = window.innerWidth <= 900;
                    if (isMobile) {
                        const trackHeight = slide.querySelector('.timeline-track').offsetHeight;
                        const nodeOffset = litNode.getBoundingClientRect().top - slide.querySelector('.timeline-track').getBoundingClientRect().top;
                        timelineFill.style.height = Math.max(nodeOffset, 0) + 'px';
                    } else {
                        const colWidth = grid.offsetWidth / grid.children.length;
                        const fillPct = (colWidth * 0.5) / grid.offsetWidth * 100;
                        timelineFill.style.width = fillPct + '%';
                    }
                    timelineFill.dataset.done = '1';
                }
            }
        }

        function downloadPDF() {
            // Reveal every slide's content (normally revealed only as you
            // scroll to it) and finish its chart/bar animations, so the
            // printed output shows every slide fully, not just the one
            // currently in view. The actual PDF is produced by the
            // browser's own print pipeline (see the @media print rules),
            // which reproduces real text and the current theme's colors
            // exactly, and lets a slide taller than one page flow onto the
            // next instead of being cropped.
            slides.forEach(slide => {
                slide.querySelectorAll('.reveal').forEach(r => r.classList.add('in'));
                animateSlideExtras(slide);
            });

            // Give layout a moment to settle before the print dialog opens.
            requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
        }

        // Magnifying-glass popup for annotated code tokens (.tok-annotatable,
        // written by highlightCode/runTokenizer above). One popup + one arrow
        // element shared by every slide, repositioned on each hover.
        function initCodeMagnifier() {
            const popup = document.createElement('div');
            popup.id = 'codeMagnifier';
            popup.innerHTML = `
                <svg class="magnifier-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <path d="M20 20l-4.8-4.8"></path>
                </svg>
                <div class="magnifier-text"></div>
            `;
            const arrow = document.createElement('div');
            arrow.id = 'codeMagnifierArrow';
            document.body.appendChild(popup);
            document.body.appendChild(arrow);

            const textEl = popup.querySelector('.magnifier-text');

            function hide() {
                popup.classList.remove('visible');
                arrow.classList.remove('visible');
            }

            function show(target) {
                const note = target.getAttribute('data-note');
                if (!note) return;
                textEl.textContent = note;
                popup.classList.add('visible');

                const rect = target.getBoundingClientRect();
                const gap = 8; // space between the token and the popup's edge
                const flap = 14; // must match the arrow element's CSS size

                // offsetWidth/offsetHeight (layout box) rather than getBoundingClientRect
                // (visual box) — the popup is mid-transition from its hidden transform
                // (scale(0.96)) right after .visible is toggled, so the rect would read
                // a few percent short.
                const popupWidth = popup.offsetWidth;
                const popupHeight = popup.offsetHeight;

                // Prefer above the token; flip below when there isn't room above the
                // fixed top bar (e.g. the first lines of the code block, or the
                // filename tab right under the slide heading).
                const topBar = document.querySelector('.top-nav');
                const minTop = (topBar ? topBar.getBoundingClientRect().bottom : 0) + 8;
                const placeBelow = rect.top - gap - popupHeight < minTop;
                const top = placeBelow ? rect.bottom + gap : rect.top - gap - popupHeight;
                const edgeY = placeBelow ? top : top + popupHeight; // popup edge nearest the token

                let left = rect.left + rect.width / 2 - popupWidth / 2;
                left = Math.max(8, Math.min(left, window.innerWidth - popupWidth - 8));

                popup.style.left = `${left}px`;
                popup.style.top = `${top}px`;

                // Center the flap on the popup's near edge so half tucks behind the
                // card and half points at the token.
                const arrowLeft = Math.max(
                    left + 10,
                    Math.min(rect.left + rect.width / 2 - flap / 2, left + popupWidth - flap - 10)
                );
                arrow.style.left = `${arrowLeft}px`;
                arrow.style.top = `${edgeY - flap / 2}px`;
                arrow.classList.add('visible');
            }

            document.addEventListener('mouseover', (e) => {
                const el = e.target.closest('.tok-annotatable');
                if (el && !el.contains(e.relatedTarget)) show(el);
            });
            document.addEventListener('mouseout', (e) => {
                const el = e.target.closest('.tok-annotatable');
                if (el && !el.contains(e.relatedTarget)) hide();
            });
            document.addEventListener('focusin', (e) => {
                const el = e.target.closest('.tok-annotatable');
                if (el) show(el);
            });
            document.addEventListener('focusout', (e) => {
                if (e.target.closest('.tok-annotatable')) hide();
            });
            document.addEventListener('scroll', hide, true);
            window.addEventListener('resize', hide);
        }

        initTheme();
        initAccessibility();
        initCodeMagnifier();
        loadPresentation();
    </script>
</body>

</html>
